name: Diagnose coverage patch

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/asterfold-v3-store-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Verify exact Git blob
        run: test "$(git hash-object .github/patches/coverage-test-fixes.patch)" = '371019272433af3c98fb32ef1dd491f2834be32b'
      - name: Capture patch applicability
        id: patch
        shell: bash
        run: |
          set +e
          git apply --check --verbose .github/patches/coverage-test-fixes.patch > patch-apply.log 2>&1
          status=$?
          cat patch-apply.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload patch evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-patch-diagnostic
          path: patch-apply.log
          if-no-files-found: error
      - name: Enforce patch applicability
        run: test "${{ steps.patch.outputs.status }}" = '0'
