name: Query Asterfold 3.2.1 release status

on:
  push:
    branches: ["agent/asterfold-v3.2.1-release-status"]
    paths:
      - .github/workflows/query-v3.2.1-release-status.yml

permissions:
  contents: write
  actions: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAIN_SHA: 28937865d10ea7b42eac2387a73b5b5a41d58171
      RELEASE_TAG: v3.2.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3.2.1-release-status
      - name: Query actions and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_SHA&per_page=100" > /tmp/runs.json
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url,publishedAt,assets > /tmp/release.json 2>/dev/null; then
            release_exists=true
          else
            release_exists=false
            printf 'null\n' > /tmp/release.json
          fi
          RELEASE_EXISTS="$release_exists" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runs = JSON.parse(fs.readFileSync('/tmp/runs.json','utf8')).workflow_runs ?? [];
          const relevant = runs
            .filter((run) => ['CI','CodeQL','Publish GitHub Release'].includes(run.name))
            .map((run) => ({id:run.id,name:run.name,event:run.event,status:run.status,conclusion:run.conclusion,head_sha:run.head_sha,head_branch:run.head_branch,created_at:run.created_at,updated_at:run.updated_at,html_url:run.html_url}));
          const release = JSON.parse(fs.readFileSync('/tmp/release.json','utf8'));
          fs.writeFileSync('release-status-v3.2.1.json', JSON.stringify({releaseExists:process.env.RELEASE_EXISTS==='true',runs:relevant,release},null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-status-v3.2.1.json
          git commit -m "chore: capture Asterfold 3.2.1 release status"
          git push origin HEAD:agent/asterfold-v3.2.1-release-status
