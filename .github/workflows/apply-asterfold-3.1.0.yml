name: Apply Asterfold 3.1.0 implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-asterfold-3-1-0
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'perf/windows11-compat-glass-3.1.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: perf/windows11-compat-glass-3.1.0
          fetch-depth: 0

      - name: Apply reviewed implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/asterfold-3.1.0.part* | tr -d '\n' | base64 --decode > /tmp/asterfold-3.1.0.patch.gz
          printf '%s  %s\n' '091cbaaa2927bc376c816cd7171ceae5de68f1e5a8a540eb1782b6a71469e697' /tmp/asterfold-3.1.0.patch.gz | sha256sum --check
          gzip --decompress --stdout /tmp/asterfold-3.1.0.patch.gz > /tmp/asterfold-3.1.0.patch
          printf '%s  %s\n' 'd6c1e7717674f6785aa28752721475a92141c077bcd976f90430d7813fa38a54' /tmp/asterfold-3.1.0.patch | sha256sum --check
          git apply --index --whitespace=error /tmp/asterfold-3.1.0.patch
          rm -f docs/audit/3.1.0/.branch-ready docs/audit/3.1.0/CONNECTOR_WRITE_CHECK.md
          rm -rf .github/patches
          rm -f .github/workflows/apply-asterfold-3.1.0.yml
          git add -A
          git diff --cached --check

      - name: Commit exact Asterfold 3.1.0 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: optimize Asterfold 3.1.0 for Windows 11 legacy GPUs [3.1.0 applied]'
          git push origin HEAD:perf/windows11-compat-glass-3.1.0
