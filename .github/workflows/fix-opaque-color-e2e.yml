name: Fix opaque color E2E expectations

on:
  push:
    branches: [fix/opaque-settings-controls-3.1.4]
    paths: [.github/workflows/fix-opaque-color-e2e.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/opaque-settings-controls-3.1.4
      - name: Require fully opaque light and dark menu colors
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('e2e/extension.spec.ts')
          text = path.read_text()
          replacements = {
              '    expect(["rgb(251, 251, 252)", "rgba(255, 255, 255, 0.96)"]).toContain(sourceMenuBounds.background);': '    expect(sourceMenuBounds.background).toBe("rgb(255, 255, 255)");',
              '    expect(["rgb(37, 39, 43)", "rgba(38, 40, 44, 0.96)"]).toContain(darkMenuBackground);': '    expect(darkMenuBackground).toBe("rgb(45, 47, 52)");',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing stale translucent expectation: {old}')
              text = text.replace(old, new)
          for stale in ('rgba(255, 255, 255, 0.96)', 'rgba(38, 40, 44, 0.96)'):
              if stale in text:
                  raise SystemExit(f'Stale translucent color remains: {stale}')
          path.write_text(text)
          PY
          rm .github/workflows/fix-opaque-color-e2e.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add e2e/extension.spec.ts .github/workflows/fix-opaque-color-e2e.yml
          git commit -m "test: require fully opaque menu colors"
          git push origin HEAD:fix/opaque-settings-controls-3.1.4
