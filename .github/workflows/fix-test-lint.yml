name: Apply guarded test lint fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-guarded-test-lint-fixes
  cancel-in-progress: true

jobs:
  fix:
    if: github.head_ref == 'agent/asterfold-v3-store-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Apply guarded substitutions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact occurrence, found {count}: {old!r}")
              file.write_text(text.replace(old, new))

          path = Path('tests/boardCanvasBehavior.test.ts')
          text = path.read_text()
          old_classes = 'KeyboardSensor: class KeyboardSensor {},\n    PointerSensor: class PointerSensor {},'
          if text.count(old_classes) != 1:
              raise SystemExit('boardCanvasBehavior: expected sensor class pair')
          text = text.replace(old_classes, 'KeyboardSensor: function KeyboardSensor() {},\n    PointerSensor: function PointerSensor() {},')
          text, count = re.subn(r'await act\(async \(\) => \{ (mocks\.dndProps\?\.[^;]+;) \}\);', r'act(() => { \1 });', text)
          if count < 1:
              raise SystemExit('boardCanvasBehavior: no synchronous act callbacks found')
          path.write_text(text)

          path = Path('tests/workspaceAppOrchestration.test.ts')
          text = path.read_text()
          text, single_count = re.subn(r'await act\(async \(\) => \{ (mocks\.[^;]+;) \}\);', r'act(() => { \1 });', text)
          text, multiline_count = re.subn(r'await act\(async \(\) => \{\n(\s+mocks\.canvas\?\.onSelectBookmark\([^\n]+\);)\n\s+\}\);', r'act(() => {\n\1\n    });', text)
          if single_count + multiline_count < 1:
              raise SystemExit('workspaceAppOrchestration: no synchronous act callbacks found')
          path.write_text(text)

          path = Path('tests/runtimeCoverage.test.ts')
          text = path.read_text()
          replace_target = '  runtimeGetUrl: vi.fn((path: string) => `chrome-extension://test${path}`),\n'
          if text.count(replace_target) != 1:
              raise SystemExit('runtimeCoverage: hoisted mock insertion target missing or duplicated')
          text = text.replace(replace_target, replace_target + '  createObjectUrl: vi.fn(() => "blob:wallpaper"),\n  revokeObjectUrl: vi.fn(),\n')
          text = text.replace('Object.defineProperty(URL, "createObjectURL", { configurable: true, value: vi.fn(() => "blob:wallpaper") });', 'Object.defineProperty(URL, "createObjectURL", { configurable: true, value: mocks.createObjectUrl });')
          text = text.replace('Object.defineProperty(URL, "revokeObjectURL", { configurable: true, value: vi.fn() });', 'Object.defineProperty(URL, "revokeObjectURL", { configurable: true, value: mocks.revokeObjectUrl });')
          text = text.replace('expect(URL.createObjectURL)', 'expect(mocks.createObjectUrl)')
          text = text.replace('expect(URL.revokeObjectURL)', 'expect(mocks.revokeObjectUrl)')
          path.write_text(text)

          path = Path('tests/workspaceIntegrationCoverage.test.ts')
          text = path.read_text()
          old_import = 'import { createElement, type MouseEvent as ReactMouseEvent } from "react";'
          if text.count(old_import) != 1:
              raise SystemExit('workspaceIntegrationCoverage: ReactMouseEvent import target missing')
          path.write_text(text.replace(old_import, 'import { createElement } from "react";'))
          replace_exact('tests/workspaceIntegrationCoverage.test.ts', '    const onSelect = vi.fn((_bookmark: Bookmark, _event: ReactMouseEvent) => undefined);\n    expect(onSelect).not.toHaveBeenCalled();\n', '')

          Path('.github/workflows/diagnose-lint.yml').unlink(missing_ok=True)
          Path('.github/workflows/fix-test-lint.yml').unlink(missing_ok=True)
          PY
          git diff --check
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Commit ordinary source files
        shell: bash
        run: |
          set -euo pipefail
          git add tests .github/workflows
          git diff --cached --check
          git config user.name 'Asterfold Release Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: satisfy strict lint in coverage suites'
          git push origin HEAD:refs/heads/agent/asterfold-v3-store-hardening
