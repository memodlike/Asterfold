name: Validate and apply coverage expansion v2

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: validate-coverage-expansion-v2
  cancel-in-progress: true

jobs:
  validate-and-apply:
    if: github.head_ref == 'agent/asterfold-v3-store-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Verify, extract and normalize coverage suites
        shell: bash
        run: |
          set -euo pipefail
          echo '67c86aec6d221762f79cb24132777ea9c2f3223a7730a886a43f18ee254b4e9f  .github/coverage-expansion/part00' | sha256sum --check
          echo '20bfcf4450fd618bd965cd92024a55a378a278a8c0397a8f957af2d08365eefb  .github/coverage-expansion/part01' | sha256sum --check
          echo '90c7abb68a75e720f25fe3f6ecb925a59c6c5f46036ffdd0884c3f67712d29e1  .github/coverage-expansion/part02' | sha256sum --check
          echo '1ac7801db3ac2865b8c7e85b643f7b65d96c5bd0aa7bebdc1ddc0840bc42119c  .github/coverage-expansion/part03' | sha256sum --check
          cat .github/coverage-expansion/part* > /tmp/coverage-expansion.tar.gz.b64
          test "$(wc -c < /tmp/coverage-expansion.tar.gz.b64)" = '20316'
          echo '40ba337b98d0960455ee7c0a279f331f0fd127f7f7707b4f27528c95cffb2b4f  /tmp/coverage-expansion.tar.gz.b64' | sha256sum --check
          base64 -d /tmp/coverage-expansion.tar.gz.b64 > /tmp/coverage-expansion.tar.gz
          test "$(wc -c < /tmp/coverage-expansion.tar.gz)" = '15236'
          echo '228b76611c27cfa4ffc2d828ebeeea74a48e8067f556e48531bdfc166082377c  /tmp/coverage-expansion.tar.gz' | sha256sum --check
          tar -xzf /tmp/coverage-expansion.tar.gz
          python .github/coverage-expansion/normalize-and-fix.py
          python .github/coverage-expansion/fix-final-four.py
          python .github/coverage-expansion/fix-unused-import.py
          python .github/coverage-expansion/fix-final-two.py
          python .github/coverage-expansion/fix-last-two.py
          python - <<'PY'
          from pathlib import Path

          settings_path = Path('tests/settingsDialogBehavior.test.ts')
          settings_text = settings_path.read_text()
          old_label = 'screen.getByRole("button", { name: "Russian" })'
          new_label = 'screen.getByRole("button", { name: "Русский" })'
          if old_label in settings_text:
              if settings_text.count(old_label) != 1:
                  raise SystemExit(f'Unexpected localized-label match count: {settings_text.count(old_label)}')
              settings_path.write_text(settings_text.replace(old_label, new_label))
          elif new_label not in settings_text:
              raise SystemExit('Localized Settings language assertion is missing')

          repository_path = Path('tests/repositoryBranchCoverage.test.ts')
          repository_text = repository_path.read_text()
          missing_fragment = '''    await expect(getWorkspaceData(database, false)).rejects.toThrow("Application settings are unavailable");
    await expect(purgeTrash(null, database)).resolves.toBe(0);'''
          missing_replacement = '''    await expect(getWorkspaceData(database, false)).rejects.toThrow("Application settings are unavailable");
    const settings = createDefaultSettings();
    await database.settings.add(settings);
    await expect(getWorkspaceData(database, false)).resolves.toEqual({ pages: [], boards: [], bookmarks: [], settings });
    await expect(purgeTrash(null, database)).resolves.toBe(0);'''
          if repository_text.count(missing_fragment) != 1:
              raise SystemExit('Expected missing-settings branch fragment exactly once')
          repository_text = repository_text.replace(missing_fragment, missing_replacement, 1)

          page_fragment = '''    await expect(duplicatePage("missing", database)).rejects.toThrow("Page not found");

    await database.pages.update(configured.id, { deletedAt: timestamp });'''
          page_replacement = '''    await expect(duplicatePage("missing", database)).rejects.toThrow("Page not found");

    const detached = await createPage("Detached", {}, database);
    await softDeletePage(detached.id, database);
    await database.pages.update(detached.id, { deletedBatchId: null });
    await restorePage(detached.id, database);
    expect(await database.pages.get(detached.id)).toMatchObject({ deletedAt: null, deletedBatchId: null });

    await database.pages.update(configured.id, { deletedAt: timestamp });'''
          if repository_text.count(page_fragment) != 1:
              raise SystemExit('Expected Page restore branch fragment exactly once')
          repository_path.write_text(repository_text.replace(page_fragment, page_replacement, 1))
          PY
          git diff --check
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Zero-warning lint
        run: npm run lint
      - name: Capture full coverage
        id: coverage
        shell: bash
        run: |
          set +e
          npm run test:coverage > coverage-expansion-v2.log 2>&1
          status=$?
          cat coverage-expansion-v2.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-expansion-v2-evidence
          path: |
            coverage-expansion-v2.log
            coverage
          if-no-files-found: error
      - name: Enforce full coverage
        shell: bash
        run: test "${{ steps.coverage.outputs.status }}" = '0'
      - name: Commit validated suites and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/coverage-expansion
          rm -f .github/workflows/validate-coverage-expansion.yml
          rm -f .github/workflows/validate-coverage-expansion-v2.yml
          rm -f .github/workflows/fix-settings-language-expectation.yml
          rm -f .github/fix-settings-language-expectation.trigger
          git add tests .github
          git diff --cached --check
          git config user.name 'Asterfold Release Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: expand behavior coverage for release gates'
          git push origin HEAD:refs/heads/agent/asterfold-v3-store-hardening
