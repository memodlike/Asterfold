name: Apply Asterfold 3.1.0 adaptive auto-renderer assertion

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-asterfold-3-1-0-auto-renderer-e2e
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.head_ref == 'perf/windows11-compat-glass-3.1.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: perf/windows11-compat-glass-3.1.0
          fetch-depth: 0

      - name: Apply reviewed auto-renderer assertion once
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/patches/fix-3.1.0-auto-renderer-e2e.patch
          if git apply --check "$patch"; then
            git apply --index --whitespace=error "$patch"
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: accept adaptive auto renderer resolution'
            git push origin HEAD:perf/windows11-compat-glass-3.1.0
          else
            echo 'Adaptive auto-renderer assertion patch is already applied.'
          fi
