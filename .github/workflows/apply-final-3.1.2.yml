name: Apply final Asterfold 3.1.2 release patch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'perf/asterfold-3.1.2-original-wallpaper-quality'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: perf/asterfold-3.1.2-original-wallpaper-quality
          fetch-depth: 0
      - name: Verify and apply final patch
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(node -p 'require("./package.json").version')" = "3.1.2" ] \
            && grep -q 'const original = file.slice' src/services/wallpaper.ts; then
            echo 'Asterfold 3.1.2 product patch is already applied.'
            exit 0
          fi

          cat \
            .github/transport/final-3.1.2/chunk-00.b64 \
            .github/transport/final-3.1.2/chunk-01.b64 \
            .github/transport/final-3.1.2/chunk-02.b64 \
            .github/transport/final-3.1.2/chunk-03.b64 \
            .github/transport/final-3.1.2/chunk-04.b64 \
            .github/transport/final-3.1.2/chunk-05.b64 \
            .github/transport/final-3.1.2/chunk-06.b64 \
            .github/transport/final-3.1.2/chunk-07a.b64 \
            .github/transport/final-3.1.2/chunk-07b.b64 \
            .github/transport/final-3.1.2/chunk-08.b64 \
            .github/transport/final-3.1.2/chunk-09.b64 \
            | tr -d '\n' | base64 -d > /tmp/asterfold-3.1.2.patch.gz
          echo 'f671cf14c6044893027118fe7288844fff492b0224e4c96ef1603e209bf3a10c  /tmp/asterfold-3.1.2.patch.gz' | sha256sum --check
          gzip -dc /tmp/asterfold-3.1.2.patch.gz > /tmp/asterfold-3.1.2.patch
          echo '27f6c7204afc9491fb782ed25e1ecb0d5ba94410e6c094709b2ee919b8fcf65b  /tmp/asterfold-3.1.2.patch' | sha256sum --check

          git apply --check /tmp/asterfold-3.1.2.patch
          git apply /tmp/asterfold-3.1.2.patch
          git diff --check
          test "$(node -p 'require("./package.json").version')" = "3.1.2"
          node scripts/validate-version.mjs
          node scripts/scan-source.mjs

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: finalize Asterfold 3.1.2'
          git push origin HEAD:perf/asterfold-3.1.2-original-wallpaper-quality
