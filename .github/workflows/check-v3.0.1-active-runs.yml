name: Inspect active Asterfold 3.0.1 release runs

# Read-only observer for the final authorized publisher.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-v3.0.1-active-runs.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture relevant workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_BRANCH: ops/v3.0.1-release-status
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > /tmp/runs.json
          release_json='{}'
          if gh release view v3.0.1 --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url,assets >/tmp/release.json 2>/dev/null; then
            release_json="$(cat /tmp/release.json)"
          fi
          RELEASE_JSON="$release_json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/runs.json', 'utf8'));
          const release = JSON.parse(process.env.RELEASE_JSON || '{}');
          const names = new Set([
            'Publish GitHub Release',
            'Publish authorized Asterfold 3.0.1',
            'Publish authorized Asterfold 3.0.1 from tag',
            'Publish authorized Asterfold 3.0.1 from verified artifacts',
            'Tag verified main release'
          ]);
          const runs = (payload.workflow_runs || [])
            .filter((run) => names.has(run.name))
            .map((run) => ({
              id: run.id,
              name: run.name,
              status: run.status,
              conclusion: run.conclusion,
              event: run.event,
              headSha: run.head_sha,
              headBranch: run.head_branch,
              url: run.html_url,
              createdAt: run.created_at,
              updatedAt: run.updated_at
            }));
          const report = {
            observedAt: new Date().toISOString(),
            runs,
            release: {
              exists: Boolean(release.url),
              url: release.url || '',
              targetCommitish: release.targetCommitish || '',
              isDraft: release.isDraft ?? null,
              isPrerelease: release.isPrerelease ?? null,
              assets: Array.isArray(release.assets) ? release.assets.map((a) => ({ name: a.name, size: a.size, url: a.url })) : []
            }
          };
          fs.writeFileSync('/tmp/active-release-runs-v3.0.1.json', `${JSON.stringify(report, null, 2)}\n`);
NODE
          path='docs/audit/observer/active-release-runs-v3.0.1.json'
          content="$(base64 -w0 /tmp/active-release-runs-v3.0.1.json)"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$REPORT_BRANCH" --jq .sha 2>/dev/null || true)"
          if test -n "$current_sha"; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='docs: update active v3.0.1 release runs' -f content="$content" -f branch="$REPORT_BRANCH" -f sha="$current_sha" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='docs: record active v3.0.1 release runs' -f content="$content" -f branch="$REPORT_BRANCH" >/dev/null
          fi
