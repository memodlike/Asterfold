name: Reply with Asterfold 3.0.1 release status

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  inspect:
    if: >-
      github.event.comment.user.login == 'memodlike' &&
      github.event.comment.body == '/status-v3.0.1-now'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reply with relevant workflow runs and Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > /tmp/runs.json
          release_json='{}'
          if gh release view v3.0.1 --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url,assets >/tmp/release.json 2>/dev/null; then
            release_json="$(cat /tmp/release.json)"
          fi
          RELEASE_JSON="$release_json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/runs.json', 'utf8'));
          const release = JSON.parse(process.env.RELEASE_JSON || '{}');
          const names = new Set([
            'Publish GitHub Release',
            'Publish authorized Asterfold 3.0.1',
            'Publish authorized Asterfold 3.0.1 from tag',
            'Publish authorized Asterfold 3.0.1 from verified artifacts',
            'Tag verified main release'
          ]);
          const runs = (payload.workflow_runs || [])
            .filter((run) => names.has(run.name))
            .slice(0, 12);
          const lines = ['## Asterfold 3.0.1 release status', ''];
          if (runs.length === 0) lines.push('- Relevant workflow runs: none found');
          for (const run of runs) {
            const result = run.conclusion ?? run.status;
            lines.push(`- [${run.name} #${run.run_number}](${run.html_url}) — **${run.status} / ${result}** — event \`${run.event}\` — branch \`${run.head_branch ?? ''}\` — SHA \`${run.head_sha}\``);
          }
          lines.push('');
          if (release.url) {
            lines.push(`**Release:** [${release.tagName}](${release.url})`);
            lines.push(`- Target: \`${release.targetCommitish}\``);
            lines.push(`- Draft: \`${release.isDraft}\`; prerelease: \`${release.isPrerelease}\``);
            lines.push(`- Assets: ${Array.isArray(release.assets) ? release.assets.length : 0}`);
            for (const asset of release.assets ?? []) lines.push(`  - ${asset.name} — ${asset.size} bytes`);
          } else {
            lines.push('**Release:** not published yet');
          }
          lines.push('', `_Observed: ${new Date().toISOString()}_`);
          fs.writeFileSync('/tmp/release-status-comment.md', `${lines.join('\n')}\n`);
NODE
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$(cat /tmp/release-status-comment.md)" >/dev/null
