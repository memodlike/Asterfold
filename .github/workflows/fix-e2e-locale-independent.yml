name: Fix locale-independent MV3 E2E selectors

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: fix-locale-independent-mv3-e2e
  cancel-in-progress: true

jobs:
  fix:
    if: github.head_ref == 'agent/asterfold-v3-store-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Apply exact locale-independent selector corrections
        run: |
          python .github/fix-e2e-locale-independent.py
          git diff --check
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static validation
        run: |
          npm run typecheck
          npm run lint
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate affected real MV3 flows
        run: npx playwright test e2e/extension.spec.ts --grep 'first-use hint|accessibility violations'
      - name: Commit ordinary E2E fix and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-e2e-locale-independent.yml
          rm -f .github/fix-e2e-locale-independent.trigger
          rm -f .github/fix-e2e-locale-independent.py
          git add e2e/extension.spec.ts .github
          git diff --cached --check
          git config user.name 'Asterfold Release Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: make MV3 localization checks locale-independent'
          git push origin HEAD:refs/heads/agent/asterfold-v3-store-hardening
