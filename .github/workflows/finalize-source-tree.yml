name: Finalize verified Asterfold source tree

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: finalize-verified-source-tree
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'agent/asterfold-v3-store-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Apply exact test corrections and version metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          replace_once('tests/appearanceDialogs.test.ts', '''    act(() => {\n      view.rerender(withI18n(createElement(MoveDialog, { ...props, open: false })));\n      view.rerender(withI18n(createElement(MoveDialog, { ...props, open: true })));\n    });\n    expect(screen.queryByRole("alert")).toBeNull();''', '''    view.rerender(withI18n(createElement(MoveDialog, { ...props, open: false })));\n    expect(screen.queryByRole("dialog")).toBeNull();\n    view.rerender(withI18n(createElement(MoveDialog, { ...props, open: true })));\n    await waitFor(() => expect(screen.queryByRole("alert")).toBeNull());''')
          replace_once('tests/boardCanvasBehavior.test.ts', 'expect(screen.getByText(board.title)).toBeVisible();', 'expect(screen.getByText(board.title, { selector: ".drag-overlay span" })).toBeVisible();')
          replacements = [
              ('name: "Add bookmark to Inbox"', 'name: "Add a bookmark to Inbox"'),
              ('name: "Add your first bookmark"', 'name: "Drop a link here or press +"'),
              ('screen.getByRole("button", { name: /Rename/ })', 'screen.getByRole("menuitem", { name: "Rename" })'),
              ('screen.getByRole("button", { name: /Two columns/ })', 'screen.getByRole("menuitem", { name: "Two columns" })'),
              ('screen.getByRole("button", { name: /Medium/ })', 'screen.getByRole("menuitem", { name: "Medium" })'),
              ('screen.getByRole("button", { name: /Move to page/ })', 'screen.getByRole("menuitem", { name: "Move to page" })'),
              ('screen.getByRole("button", { name: /Duplicate/ })', 'screen.getByRole("menuitem", { name: "Duplicate" })'),
              ('screen.getByRole("button", { name: /Move to trash/ })', 'screen.getByRole("menuitem", { name: "Move to trash" })'),
          ]
          for old, new in replacements:
              replace_once('tests/boardColumnBehavior.test.ts', old, new)

          replace_once('tests/importWorkerBehavior.test.ts', '''    const worker = FakeWorker.instances[0]!;\n    await vi.advanceTimersByTimeAsync(30_001);\n    await expect(pending).rejects.toThrow("Import worker timed out");''', '''    const worker = FakeWorker.instances[0]!;\n    const timeoutRejection = expect(pending).rejects.toThrow("Import worker timed out");\n    await vi.advanceTimersByTimeAsync(30_001);\n    await timeoutRejection;''')
          replace_once('tests/runtimeCoverage.test.ts', '''    const timedOut = parseHtmlOffThread("timeout");\n    await vi.advanceTimersByTimeAsync(30_001);\n    await expect(timedOut).rejects.toThrow("Import worker timed out");''', '''    const timedOut = parseHtmlOffThread("timeout");\n    const timeoutRejection = expect(timedOut).rejects.toThrow("Import worker timed out");\n    await vi.advanceTimersByTimeAsync(30_001);\n    await timeoutRejection;''')
          runtime = Path('tests/runtimeCoverage.test.ts')
          runtime.write_text(runtime.read_text().replace('The action could not be completed.', 'Unable to complete the action'))

          replace_once('tests/workspaceAppOrchestration.test.ts', '''    act(() => { mocks.canvas?.onAddBookmark(board); });\n    expect(mocks.editor?.initialBoardId).toBe(board.id);\n    mocks.canvas?.onEditBookmark(bookmark);\n    expect(mocks.editor?.bookmark).toEqual(bookmark);''', '''    act(() => { mocks.canvas?.onAddBookmark(board); });\n    await waitFor(() => expect(mocks.editor?.initialBoardId).toBe(board.id));\n    act(() => { mocks.canvas?.onEditBookmark(bookmark); });\n    await waitFor(() => expect(mocks.editor?.bookmark).toEqual(bookmark));''')
          replace_once('tests/workspaceAppOrchestration.test.ts', '''    act(() => { mocks.launcher?.onSearch(); });\n    expect(mocks.search?.open).toBe(true);''', '''    act(() => { mocks.launcher?.onSearch(); });\n    await waitFor(() => expect(mocks.search?.open).toBe(true));''')
          replace_once('tests/workspaceAppOrchestration.test.ts', '''    fireEvent.keyDown(window, { key: "k", ctrlKey: true });\n    expect(mocks.search?.open).toBe(true);''', '''    fireEvent.keyDown(window, { key: "k", ctrlKey: true });\n    await waitFor(() => expect(mocks.search?.open).toBe(true));''')

          integration_replacements = [
              ('Opening your workspace…', 'Opening your new tab…'),
              ('screen.getByRole("menuitem", { name: "New page" })', 'await screen.findByRole("menuitem", { name: "Create page" })'),
              ('screen.getByRole("button", { name: "Rename" })', 'screen.getByRole("menuitem", { name: "Rename" })'),
              ('screen.getByRole("button", { name: "Two columns" })', 'screen.getByRole("menuitem", { name: "Two columns" })'),
              ('screen.getByRole("button", { name: "Copy URL" })', 'screen.getByRole("menuitem", { name: "Copy URL" })'),
              ('screen.getByRole("button", { name: "Move to Trash" })', 'screen.getByRole("menuitem", { name: "Move to trash" })'),
              ('screen.getByRole("button", { name: "Move to page" })', 'screen.getByRole("menuitem", { name: "Move to page" })'),
              ('name: "Add bookmark to Inbox"', 'name: "Add a bookmark to Inbox"'),
              ('The action could not be completed.', 'Unable to complete the action'),
          ]
          for old, new in integration_replacements:
              replace_once('tests/workspaceIntegrationCoverage.test.ts', old, new)
          integration = Path('tests/workspaceIntegrationCoverage.test.ts')
          text = integration.read_text()
          if text.count('screen.getByRole("button", { name: "Duplicate" })') != 2:
              raise SystemExit('Expected two Duplicate context actions')
          text = text.replace('screen.getByRole("button", { name: "Duplicate" })', 'screen.getByRole("menuitem", { name: "Duplicate" })')
          if text.count('screen.getByRole("button", { name: "Move" })') != 1:
              raise SystemExit('Expected one context Move action')
          text = text.replace('screen.getByRole("button", { name: "Move" })', 'screen.getByRole("menuitem", { name: "Move" })', 1)
          integration.write_text(text)

          old = '3.0.0'
          new = '3.0.1'
          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          if package.get('version') not in {old, new}:
              raise SystemExit(f"Unexpected package version: {package.get('version')}")
          package['version'] = new
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text())
          if lock.get('version') not in {old, new} or lock.get('packages', {}).get('', {}).get('version') not in {old, new}:
              raise SystemExit('Unexpected package-lock root version')
          lock['version'] = new
          lock['packages']['']['version'] = new
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          current_paths = [
              'README.md', 'tests/manifestPolicy.test.ts', 'e2e/upgrade.spec.ts', 'src/db/migrations.ts',
              'docs/store/privacy.html', 'docs/store/privacy-practices.md', 'docs/store/submission-checklist.md',
              'store-assets/listing/store-listing-en.md', 'store-assets/listing/store-listing-ru.md',
              'store-assets/listing/submission-values.md', 'docs/release/release-notes.md',
              'docs/release/versioning.md', 'docs/release/install.md', 'docs/audit/FINDINGS_STATUS.md',
              'docs/audit/EVIDENCE.md', 'docs/audit/QA_REPORT.md', 'docs/security/review.md',
              'docs/security/permissions.md', 'docs/security/threat-model.md', 'docs/security/privacy.md',
          ]
          for raw_path in current_paths:
              path = Path(raw_path)
              path.write_text(path.read_text().replace('v3.0.0', 'v3.0.1').replace(old, new))

          note = '> Version 3.0.0 was an internal unreleased release candidate and was superseded by 3.0.1 before publication.\n\n'
          for raw_path, marker in [
              ('README.md', '## Release status\n\n'),
              ('docs/release/versioning.md', '# Release versioning\n\n'),
              ('docs/release/release-notes.md', '# Asterfold 3.0.1\n\n'),
          ]:
              path = Path(raw_path)
              text = path.read_text()
              if note not in text:
                  text = text.replace(marker, marker + note) if marker in text else text + '\n\n' + note
              path.write_text(text)

          audit_dir = Path('docs/audit/3.0.1')
          audit_dir.mkdir(parents=True, exist_ok=True)
          (audit_dir / 'VERSION_TRANSITION.md').write_text(
              '# Version transition\n\n'
              '- Published predecessor: `2.2.3`.\n'
              '- `3.0.0` was an internal unreleased release candidate.\n'
              '- Final release target: `3.0.1` / `v3.0.1`.\n'
              '- No `v3.0.0` tag or GitHub Release may be created.\n'
          )
          PY
          rm -rf .github/patches
          rm -f .github/workflows/apply-coverage-test-fixes.yml
          rm -f .github/workflows/diagnose-coverage-patch.yml
          rm -f .github/workflows/finalize-version-3-0-1.yml
          rm -f .github/workflows/finalize-source-tree.yml
          node scripts/validate-version.mjs
          git diff --check
      - name: Commit verified ordinary source tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'Asterfold Release Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: finalize Asterfold 3.0.1 source tree'
          git push origin HEAD:refs/heads/agent/asterfold-v3-store-hardening
