name: Apply Asterfold 3.1.0 adaptive dark menu assertion

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'perf/windows11-compat-glass-3.1.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: perf/windows11-compat-glass-3.1.0
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          patch=.github/patches/fix-3.1.0-dark-menu-color.patch
          if git apply --check "$patch"; then
            git apply --index --whitespace=error "$patch"
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: accept adaptive dark context menu surface'
            git push origin HEAD:perf/windows11-compat-glass-3.1.0
          fi
