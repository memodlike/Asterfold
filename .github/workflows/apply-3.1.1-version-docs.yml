name: Align Asterfold 3.1.1 release documents

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  align:
    if: ${{ github.head_ref == 'perf/asterfold-3.1.1-wallpaper-import-polish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: perf/asterfold-3.1.1-wallpaper-import-polish
          fetch-depth: 0
      - name: Align reviewed release version strings
        shell: bash
        run: |
          set -euo pipefail
          files=(
            docs/store/privacy.html
            docs/store/submission-checklist.md
            store-assets/listing/submission-values.md
            docs/release/release-notes.md
          )
          perl -0pi -e 's/3\.1\.0/3.1.1/g' "${files[@]}"
          grep -F 'Policy version: 3.1.1' docs/store/privacy.html
          grep -F 'Asterfold 3.1.1' docs/store/privacy.html
          grep -F 'Current version: 3.1.1' docs/store/submission-checklist.md
          grep -F 'Current version: 3.1.1' store-assets/listing/submission-values.md
          grep -F '# Asterfold 3.1.1' docs/release/release-notes.md
          git add "${files[@]}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: align Asterfold 3.1.1 release metadata'
          git push origin HEAD:perf/asterfold-3.1.1-wallpaper-import-polish
