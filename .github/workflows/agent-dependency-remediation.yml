name: Agent dependency remediation

on:
  push:
    branches:
      - agent/design-system-hardening-3.2.1

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/design-system-hardening-3.2.1
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Resolve patched transitive nanoid
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.json.before
          npm update nanoid --package-lock-only --ignore-scripts
          cmp package.json /tmp/package.json.before
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const version = lock.packages?.['node_modules/nanoid']?.version;
          if (version !== '3.3.17') throw new Error(`Expected nanoid 3.3.17, got ${version}`);
          NODE
      - name: Verify dependency gates
        run: |
          npm ci
          npm run audit:production
          npm audit --json > npm-audit.json || true
          node scripts/check-audit-baseline.mjs npm-audit.json
          rm -f npm-audit.json
      - name: Commit lockfile-only remediation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          git diff --check
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): update nanoid security patch"
          git push origin HEAD:agent/design-system-hardening-3.2.1
