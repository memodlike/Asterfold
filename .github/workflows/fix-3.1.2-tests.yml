name: Fix Asterfold 3.1.2 stale tests

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'perf/asterfold-3.1.2-original-wallpaper-quality'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: perf/asterfold-3.1.2-original-wallpaper-quality
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Update stale 3.1.2 test contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('tests/settingsDialogCoverage.test.ts')
          text = settings.read_text()
          text = text.replace(
              "return container.querySelector<HTMLInputElement>('input[accept*=\"image/png\"]')!;",
              "return container.querySelector<HTMLInputElement>('input[accept*=\".webp\"]')!;",
          )
          text = text.replace(
              r'expect(await screen.findByText(/v3\.1\.1 · 1 \/ 1 \/ 1/)).toBeVisible();',
              r'expect(await screen.findByText(/v3\.1\.2 · 1 \/ 1 \/ 1/)).toBeVisible();',
          )
          settings.write_text(text)

          wallpaper = Path('tests/wallpaper.test.ts')
          text = wallpaper.read_text()
          old = '''async function bytes(blob: Blob): Promise<number[]> {
            return [...new Uint8Array(await blob.arrayBuffer())];
          }'''
          new = '''async function bytes(blob: Blob): Promise<number[]> {
            const buffer = typeof blob.arrayBuffer === "function"
              ? await blob.arrayBuffer()
              : await new Promise<ArrayBuffer>((resolve, reject) => {
                const reader = new FileReader();
                reader.addEventListener("load", () => resolve(reader.result as ArrayBuffer), { once: true });
                reader.addEventListener("error", () => reject(reader.error ?? new Error("Blob could not be read")), { once: true });
                reader.readAsArrayBuffer(blob);
              });
            return [...new Uint8Array(buffer)];
          }'''
          if old not in text:
              raise SystemExit('Expected wallpaper bytes helper not found')
          wallpaper.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Verify targeted tests
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/settingsDialogCoverage.test.ts tests/wallpaper.test.ts
      - name: Publish test corrections
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Test corrections are already present.'
            exit 0
          fi
          git add tests/settingsDialogCoverage.test.ts tests/wallpaper.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: align Asterfold 3.1.2 wallpaper coverage'
          git push origin HEAD:perf/asterfold-3.1.2-original-wallpaper-quality
