name: Fix Asterfold 3.2.2 lint findings

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'release/asterfold-3.2.2-design-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release/asterfold-3.2.2-design-hardening
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Apply minimal lint-safe fixes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const workspacePath = 'src/app/WorkspaceApp.tsx';
          let workspace = fs.readFileSync(workspacePath, 'utf8');
          workspace = workspace.replace(
            '  const activePage = workspace.pages.find((page) => page.id === workspace.settings.activePageId) ?? workspace.pages[0];\n  useEffect(() => {\n    if (!pendingReveal || !activePage || activePage.id !== pendingReveal.pageId) return;',
            '  const activePage = workspace.pages.find((page) => page.id === workspace.settings.activePageId) ?? workspace.pages[0];\n  const activePageId = activePage?.id;\n  useEffect(() => {\n    if (!pendingReveal || !activePageId || activePageId !== pendingReveal.pageId) return;'
          );
          workspace = workspace.replace(
            '  }, [activePage?.id, pendingReveal, workspace.bookmarks, workspace.settings.theme.motion]);',
            '  }, [activePageId, pendingReveal, workspace.bookmarks, workspace.settings.theme.motion]);'
          );
          fs.writeFileSync(workspacePath, workspace);

          const toastPath = 'src/components/ToastRegion.tsx';
          let toast = fs.readFileSync(toastPath, 'utf8');
          toast = toast.replace('  const pause = (id: number): void => {', '  const pause = useCallback((id: number): void => {');
          toast = toast.replace(
            '    deadlines.current.delete(id);\n  };\n  const resume = (toast: Toast): void => {',
            '    deadlines.current.delete(id);\n  }, []);\n  const resume = useCallback((toast: Toast): void => {'
          );
          toast = toast.replace(
            '    else schedule(toast.id, duration);\n  };\n  const runAction = async (toast: Toast): Promise<void> => {',
            '    else schedule(toast.id, duration);\n  }, [remove, schedule]);\n  const runAction = async (toast: Toast): Promise<void> => {'
          );
          fs.writeFileSync(toastPath, toast);
          NODE
          rm -f .github/workflows/fix-v3.2.2-lint.yml
          git diff --check
      - name: Verify focused gates
        run: |
          npm ci
          npm run typecheck
          npm run lint
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): satisfy React hook purity gates"
          git push origin HEAD:release/asterfold-3.2.2-design-hardening
