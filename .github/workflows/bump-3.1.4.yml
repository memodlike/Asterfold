name: Bump Asterfold 3.1.4

on:
  push:
    branches: [fix/opaque-settings-controls-3.1.4]
    paths: [.github/workflows/bump-3.1.4.yml]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/opaque-settings-controls-3.1.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Update versioned release files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = '3.1.4';
          const read = (path) => fs.readFileSync(path, 'utf8');
          const write = (path, text) => fs.writeFileSync(path, text);
          const replaceRequired = (path, from, to) => {
            const text = read(path);
            if (!text.includes(from)) throw new Error(`${path}: missing ${from}`);
            write(path, text.replace(from, to));
          };

          const pkg = JSON.parse(read('package.json'));
          pkg.version = version;
          write('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const lock = JSON.parse(read('package-lock.json'));
          lock.version = version;
          lock.packages[''].version = version;
          write('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);

          replaceRequired('docs/security/privacy.md', 'Policy version: 3.1.3', `Policy version: ${version}`);
          replaceRequired('docs/security/privacy.md', 'Applies to: Asterfold 3.1.3', `Applies to: Asterfold ${version}`);
          replaceRequired('docs/store/privacy.html', 'Policy version: 3.1.3', `Policy version: ${version}`);
          replaceRequired('docs/store/privacy.html', 'Asterfold 3.1.3', `Asterfold ${version}`);
          replaceRequired('docs/store/submission-checklist.md', 'Current version: 3.1.3', `Current version: ${version}`);
          replaceRequired('store-assets/listing/submission-values.md', 'Current version: 3.1.3', `Current version: ${version}`);

          const previousNotes = read('docs/release/release-notes.md')
            .replace(/^# Asterfold 3\.1\.3\n\n/, '## 3.1.3 — Flash-free new-tab startup\n\n');
          const releaseNotes = `# Asterfold ${version}\n\n## Opaque, readable interface surfaces\n\n- Makes Settings, editors, search, move dialogs, Quick Save and every dropdown surface fully opaque in both light and dark themes.\n- Prevents wallpaper and workspace content from bleeding through menus, forms and popovers.\n- Uses theme-aware borders, focus rings and shadows without GPU-heavy live backdrop filters.\n\n## Custom adaptive dropdowns and locale flags\n\n- Replaces visible native selects with one accessible Asterfold listbox system across the extension.\n- Supports pointer input, Arrow keys, Home, End, Enter, Space, Escape, Tab and typeahead search.\n- Positions menus above or below according to the available viewport and keeps them inside the screen.\n- Replaces text country codes with local SVG flags that render consistently on Windows, macOS and Linux.\n\n## Reliable Appearance controls\n\n- Applies theme, background, glass, opacity, blur, dimming, wallpaper blur and saturation changes immediately.\n- Persists rapid slider input with a short debounce instead of writing IndexedDB on every pointer frame.\n- Flushes pending settings safely when Settings closes and preserves uploaded-wallpaper metadata.\n\n## Weak-PC and Windows 11 optimization\n\n- Preserves the Radeon R5 230/Caicos compatibility path and avoids classifying missing WebGL as software rendering.\n- Uses compatibility-safe opaque controls, compositor-safe motion and no live backdrop blur in constrained modes.\n- Keeps reduced-transparency and reduced-motion preferences authoritative.\n\n## Verification\n\n- Adds dedicated custom-select coverage for pointer, keyboard, typeahead, disabled states, adaptive placement and outside-click behavior.\n- Retains strict global coverage thresholds instead of lowering them.\n- Retains security scans, dependency review, CodeQL, deterministic Linux/Windows packaging, Store validation, real MV3 accessibility/visual E2E, Windows stress and exact 2.2.3 upgrade gates.\n\n## Previous release details\n\n${previousNotes}`;
          write('docs/release/release-notes.md', releaseNotes);

          let readme = read('README.md');
          readme = readme.replace('Asterfold 3.1.3 produces a reproducible, cryptographically verifiable release containing:', `Asterfold ${version} produces a reproducible, cryptographically verifiable release containing:`);
          readme = readme.replace(/\*\*Asterfold 3\.1\.3\*\*[^\n]*/, `**Asterfold ${version}** makes every settings, editor, search and dropdown surface fully opaque; adds one accessible theme-aware dropdown system with cross-platform SVG flags; restores immediate Appearance live preview; and preserves strict Radeon R5 230/weak-PC compatibility.`);
          readme = readme.replace('1. **v3.1.3 — Flash-free new-tab startup.', '1. **v3.1.4 — Opaque settings and adaptive controls.** Makes all overlays fully opaque, introduces accessible theme-aware dropdowns with SVG flags, restores live Appearance controls, and preserves weak-GPU optimization.\n2. **v3.1.3 — Flash-free new-tab startup.');
          readme = readme.replace(/^2\. \*\*v3\.1\.2/m, '3. **v3.1.2').replace(/^3\. \*\*v3\.1\.1/m, '4. **v3.1.1').replace(/^4\. \*\*v3\.1\.0/m, '5. **v3.1.0').replace(/^5\. \*\*v3\.0\.1/m, '6. **v3.0.1').replace(/^6\. \*\*v2\.2\.3/m, '7. **v2.2.3').replace(/^7\. \*\*v2\.2\.2/m, '8. **v2.2.2').replace(/^8\. \*\*v2\.2\.1/m, '9. **v2.2.1').replace(/^9\. \*\*v2\.2\.0/m, '10. **v2.2.0').replace(/^10\. \*\*v2\.1\.x/m, '11. **v2.1.x').replace(/^11\. \*\*v2\.0\.x/m, '12. **v2.0.x');
          write('README.md', readme);
          NODE
          rm .github/workflows/bump-3.1.4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json docs/security/privacy.md docs/store/privacy.html docs/store/submission-checklist.md store-assets/listing/submission-values.md docs/release/release-notes.md README.md .github/workflows/bump-3.1.4.yml
          git commit -m "chore: bump Asterfold to 3.1.4"
          git push origin HEAD:fix/opaque-settings-controls-3.1.4
