name: Apply verified coverage test fixes

on:
  push:
    branches:
      - agent/asterfold-v3-store-hardening
    paths:
      - .github/patches/coverage-test-fixes.patch
      - .github/patches/coverage-test-fixes.trigger
      - .github/workflows/apply-coverage-test-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-coverage-test-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo '10ac80aedd4e95fa0234e2e2a8c3dfd272e6da0fa9dfdfc9f0fe51640f4df6c6  .github/patches/coverage-test-fixes.patch' | sha256sum --check
          git apply --check .github/patches/coverage-test-fixes.patch
          git apply .github/patches/coverage-test-fixes.patch
          rm -f .github/patches/coverage-test-fixes.patch
          rm -f .github/patches/coverage-test-fixes.trigger
          rm -f .github/workflows/apply-coverage-test-fixes.yml
          git add tests .github
          git diff --cached --check
      - name: Commit ordinary source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Asterfold Release Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: correct coverage regression expectations'
          git push origin HEAD:refs/heads/agent/asterfold-v3-store-hardening
