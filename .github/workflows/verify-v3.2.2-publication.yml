name: Verify Asterfold 3.2.2 publication

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    if: github.head_ref == 'ops/verify-v3.2.2-publication'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect exact-source workflows and published release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: f913d8689efbf11d0c4b0fa9b04008ee54e4f82f
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_SOURCE_SHA&per_page=100" > runs.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('runs.json', 'utf8'));
          for (const run of payload.workflow_runs ?? []) {
            console.log(`RUN id=${run.id} name=${run.name} event=${run.event} status=${run.status} conclusion=${run.conclusion} branch=${run.head_branch}`);
          }
          NODE
          if ! gh release view v3.2.2 --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url,assets > release.json; then
            echo "RELEASE_NOT_FOUND"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          if (release.tagName !== 'v3.2.2') throw new Error(`Unexpected tag: ${release.tagName}`);
          if (release.isDraft) throw new Error('Release is still draft');
          if (release.isPrerelease) throw new Error('Release is prerelease');
          const expected = [
            'Asterfold-Chrome.zip',
            'Asterfold-Store-Assets.zip',
            'checksums.txt',
            'chrome-unpacked.zip',
            'extension-source.zip',
            'provenance.json',
            'sbom.spdx.json',
          ].sort();
          const actual = (release.assets ?? []).map((asset) => asset.name).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Release assets mismatch. Actual: ${actual.join(', ')}`);
          }
          console.log(`Published release verified: ${release.url}`);
          console.log(`Assets: ${actual.join(', ')}`);
          NODE
