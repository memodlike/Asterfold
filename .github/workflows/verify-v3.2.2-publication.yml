name: Verify Asterfold 3.2.2 publication

on:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  verify-release:
    if: github.head_ref == 'ops/verify-v3.2.2-publication'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch protected release workflow on v3.2.2
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: f913d8689efbf11d0c4b0fa9b04008ee54e4f82f
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.2.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; no dispatch needed."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_SOURCE_SHA&per_page=100" > before.json
          existing="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runs = JSON.parse(fs.readFileSync('before.json', 'utf8')).workflow_runs ?? [];
          const active = runs.find((r) => r.name === 'Publish GitHub Release' && ['queued','in_progress'].includes(r.status));
          process.stdout.write(active ? String(active.id) : '');
          NODE
          )"
          if [ -z "$existing" ]; then
            echo "Dispatching release.yml on ref v3.2.2"
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v3.2.2
          else
            echo "Release workflow already active: $existing"
          fi
          sleep 5
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_SOURCE_SHA&per_page=100" > after.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runs = JSON.parse(fs.readFileSync('after.json', 'utf8')).workflow_runs ?? [];
          for (const run of runs.filter((r) => r.name === 'Publish GitHub Release')) {
            console.log(`RELEASE_RUN id=${run.id} event=${run.event} status=${run.status} conclusion=${run.conclusion} branch=${run.head_branch}`);
          }
          if (!runs.some((r) => r.name === 'Publish GitHub Release' && ['queued','in_progress','completed'].includes(r.status))) {
            throw new Error('Publish GitHub Release workflow did not start');
          }
          NODE
