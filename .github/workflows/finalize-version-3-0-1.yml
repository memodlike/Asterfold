name: Finalize Asterfold 3.0.1 version metadata

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: finalize-asterfold-3-0-1-version
  cancel-in-progress: true

jobs:
  finalize:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Finalization is performed by the verified source commit; this temporary workflow will be removed.'
