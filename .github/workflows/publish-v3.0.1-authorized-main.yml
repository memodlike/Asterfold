name: Publish authorized Asterfold 3.0.1 from verified artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v3.0.1-authorized-main.yml
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read
  attestations: write
  id-token: write

concurrency:
  group: authorized-release-v3.0.1-final
  cancel-in-progress: false

env:
  SOURCE_SHA: 642e921ca0fd47e56d0d82c5b9609e8986915c3c
  SOURCE_CI_RUN: "30427609096"
  RELEASE_TAG: v3.0.1
  REPORT_BRANCH: release/v3.0.1-final-trigger

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == 'memodlike' &&
       github.event.comment.body == '/publish-v3.0.1')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact annotated tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v3.0.1
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag and exact source checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          test "$(git cat-file -t refs/tags/$RELEASE_TAG)" = tag
          test "$(git rev-list -n 1 refs/tags/$RELEASE_TAG)" = "$SOURCE_SHA"
          test "$(node -p "require('./package.json').version")" = "3.0.1"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&status=completed&per_page=100" > workflow-runs.json
          EXPECTED_SOURCE_SHA="$SOURCE_SHA" REQUIRED_WORKFLOWS=CI,CodeQL node scripts/verify-required-workflows.mjs workflow-runs.json
          rm workflow-runs.json
          npm run validate:version

      - name: Download exact Linux and Windows release subjects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-linux release-windows release
          mkdir release-linux release-windows release
          gh run download "$SOURCE_CI_RUN" --repo "$GITHUB_REPOSITORY" --name release-linux --dir release-linux
          gh run download "$SOURCE_CI_RUN" --repo "$GITHUB_REPOSITORY" --name release-windows --dir release-windows
          for name in Asterfold-Chrome.zip chrome-unpacked.zip extension-source.zip Asterfold-Store-Assets.zip sbom.spdx.json; do
            cmp "release-linux/$name" "release-windows/$name"
            cp "release-linux/$name" "release/$name"
          done
          unzip -q release/chrome-unpacked.zip -d release

      - name: Generate and verify provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          env -u GITHUB_SHA RELEASE_TAG="$RELEASE_TAG" node scripts/generate-provenance.mjs
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { checksumLine } from './scripts/release-lib.mjs';
          const names = ['Asterfold-Chrome.zip', 'chrome-unpacked.zip', 'extension-source.zip', 'Asterfold-Store-Assets.zip', 'sbom.spdx.json', 'provenance.json'];
          const lines = await Promise.all(names.map((name) => checksumLine(resolve('release', name))));
          await writeFile('release/checksums.txt', `${lines.join('\n')}\n`, 'utf8');
NODE
          node scripts/validate-release-package.mjs
          EXPECTED_SOURCE_SHA="$SOURCE_SHA" EXPECTED_TAG="$RELEASE_TAG" node scripts/verify-provenance.mjs release

      - name: Detect existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest release assets
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-checksums: release/checksums.txt

      - name: Attest checksums manifest
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: release/checksums.txt

      - name: Attest Store package SBOM
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: release/Asterfold-Chrome.zip
          sbom-path: release/sbom.spdx.json

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release was published concurrently; continuing with verification."
            exit 0
          fi
          store_sha="$(sha256sum release/Asterfold-Chrome.zip | cut -d' ' -f1)"
          cp docs/release/release-notes.md release-notes.md
          printf '\n### Verification\n\n`Asterfold-Chrome.zip` SHA-256: `%s`\n\nBuild provenance, SBOM and checksums are attached. GitHub-generated source archives are not the Chrome Web Store upload package.\n' "$store_sha" >> release-notes.md
          gh release create "$RELEASE_TAG" \
            release/Asterfold-Chrome.zip \
            release/chrome-unpacked.zip \
            release/extension-source.zip \
            release/Asterfold-Store-Assets.zip \
            release/checksums.txt \
            release/provenance.json \
            release/sbom.spdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Asterfold 3.0.1" \
            --notes-file release-notes.md \
            --latest

      - name: Download and verify published Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published-release && mkdir published-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published-release
          expected=(Asterfold-Chrome.zip chrome-unpacked.zip extension-source.zip Asterfold-Store-Assets.zip checksums.txt provenance.json sbom.spdx.json)
          mapfile -t actual < <(find published-release -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${sorted_expected[*]}"
          for name in "${expected[@]}"; do cmp "release/$name" "published-release/$name"; done
          (cd published-release && sha256sum --check checksums.txt)
          EXPECTED_SOURCE_SHA="$SOURCE_SHA" EXPECTED_TAG="$RELEASE_TAG" node scripts/verify-provenance.mjs published-release
          gh attestation verify published-release/Asterfold-Chrome.zip --repo "$GITHUB_REPOSITORY"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url,assets > release-result.json

      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-github-release-v3.0.1
          path: |
            published-release
            release-result.json
          if-no-files-found: error

      - name: Record publisher result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          release_json='{}'
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url,assets >/tmp/release.json 2>/dev/null; then
            release_json="$(cat /tmp/release.json)"
          fi
          checksum_file='release/checksums.txt'
          test -f published-release/checksums.txt && checksum_file='published-release/checksums.txt'
          CHECKSUM_FILE="$checksum_file" JOB_STATUS="$JOB_STATUS" RELEASE_JSON="$release_json" SOURCE_SHA="$SOURCE_SHA" RELEASE_TAG="$RELEASE_TAG" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(process.env.RELEASE_JSON || '{}');
          const checksums = {};
          if (fs.existsSync(process.env.CHECKSUM_FILE)) {
            for (const line of fs.readFileSync(process.env.CHECKSUM_FILE, 'utf8').trim().split(/\n/u)) {
              const match = line.match(/^([a-f0-9]{64})  (.+)$/u);
              if (match) checksums[match[2]] = match[1];
            }
          }
          const report = {
            repository: process.env.GITHUB_REPOSITORY,
            sourceCommit: process.env.SOURCE_SHA,
            tag: process.env.RELEASE_TAG,
            workflowRunId: process.env.GITHUB_RUN_ID,
            observedAt: new Date().toISOString(),
            jobStatus: process.env.JOB_STATUS,
            release: {
              exists: Boolean(release.url),
              url: release.url || '',
              targetCommitish: release.targetCommitish || '',
              isDraft: release.isDraft ?? null,
              isPrerelease: release.isPrerelease ?? null,
              assets: Array.isArray(release.assets) ? release.assets.map((asset) => ({ name: asset.name, size: asset.size, url: asset.url })) : []
            },
            checksums
          };
          fs.writeFileSync('/tmp/final-release-v3.0.1.json', `${JSON.stringify(report, null, 2)}\n`);
NODE
          path='docs/audit/observer/final-published-release-v3.0.1.json'
          content="$(base64 -w0 /tmp/final-release-v3.0.1.json)"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$REPORT_BRANCH" --jq .sha 2>/dev/null || true)"
          if test -n "$current_sha"; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='docs: record final published Asterfold 3.0.1 release' -f content="$content" -f branch="$REPORT_BRANCH" -f sha="$current_sha" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='docs: record final published Asterfold 3.0.1 release' -f content="$content" -f branch="$REPORT_BRANCH" >/dev/null
          fi
