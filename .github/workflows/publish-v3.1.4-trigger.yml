name: Trigger Asterfold 3.1.4 Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Create exact tag and dispatch verified release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: v3.1.4
          REQUIRED_MESSAGE: ci: trigger Asterfold 3.1.4 release
        shell: bash
        run: |
          set -euo pipefail

          commit_message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA" --jq '.commit.message')"
          if [ "$commit_message" != "$REQUIRED_MESSAGE" ]; then
            echo "Skipping non-release main commit: $TARGET_SHA"
            exit 0
          fi

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$TARGET_SHA" ]; then
            echo "::error::main moved from $TARGET_SHA to $main_sha before release dispatch"
            exit 1
          fi

          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$existing_sha" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$TARGET_SHA"
          elif [ "$existing_sha" != "$TARGET_SHA" ]; then
            echo "::error::Tag $RELEASE_TAG points to $existing_sha instead of $TARGET_SHA"
            exit 1
          fi

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG"

          sleep 5
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --branch "$RELEASE_TAG" \
            --limit 3
