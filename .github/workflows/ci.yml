name: Bootstrap Asterfold 2.2.3

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: bootstrap-223-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply-release-candidate:
    if: github.actor == 'memodlike' && github.event.pull_request.head.ref == 'agent/chrome-store-readiness-2.2.3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/chrome-store-readiness-2.2.3
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize reviewed 2.2.3 source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/asterfold-2.2.3.patch.gz
          gzip -dc /tmp/asterfold-2.2.3.patch.gz > /tmp/asterfold-2.2.3.patch
          git apply --index --whitespace=error-all /tmp/asterfold-2.2.3.patch
          rm -rf .bootstrap
          git add -A
          git config user.name "Asterfold Release Bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No release candidate changes to commit."
            exit 0
          fi
          git commit -m "fix: complete Chrome Store readiness for 2.2.3"
          git push origin HEAD:agent/chrome-store-readiness-2.2.3
