name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version consistency
        run: npm run validate:version
      - name: Production dependency audit
        run: npm run audit:production
      - name: Capture development dependency audit
        shell: bash
        run: npm audit --json > npm-audit.json || true
      - name: Upload development audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit-development
          path: npm-audit.json
          if-no-files-found: error
      - name: Development dependency audit baseline
        run: node scripts/check-audit-baseline.mjs npm-audit.json
      - name: Source security scan
        run: npm run scan:source
      - name: Capture typecheck result
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload typecheck evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: typecheck-evidence
          path: typecheck.log
          if-no-files-found: error
      - name: Enforce typecheck result
        shell: bash
        run: test "${{ steps.typecheck.outputs.status }}" = "0"
      - name: Capture lint result
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > lint.log 2>&1
          status=$?
          cat lint.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload lint evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-evidence
          path: lint.log
          if-no-files-found: error
      - name: Enforce lint result
        shell: bash
        run: test "${{ steps.lint.outputs.status }}" = "0"
      - name: Capture coverage result
        id: coverage
        shell: bash
        run: |
          set +e
          npm run test:coverage > coverage.log 2>&1
          status=$?
          cat coverage.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-evidence
          path: |
            coverage.log
            coverage
          if-no-files-found: error
      - name: Enforce coverage result
        shell: bash
        run: test "${{ steps.coverage.outputs.status }}" = "0"
      - name: Chrome Web Store asset validation
        run: npm run validate:store
      - name: Reproducible release and package validation
        run: npm run release:repro
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real MV3, accessibility and visual E2E
        run: npm run test:e2e
      - name: Prepare exact 2.2.3 upgrade fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upgrade && mkdir -p .upgrade/extension
          gh release download v2.2.3 --repo "$GITHUB_REPOSITORY" --pattern Asterfold-Chrome.zip --dir .upgrade
          echo "e666c0e40ca2bcd1631b04e3b9087e38b26f71336664ecfc475ee8b4d610920a  .upgrade/Asterfold-Chrome.zip" | sha256sum --check
          unzip -q .upgrade/Asterfold-Chrome.zip -d .upgrade/extension
          test "$(node -p "require('./.upgrade/extension/manifest.json').version")" = "2.2.3"
      - name: Exact 2.2.3 upgrade E2E
        env:
          ASTERFOLD_UPGRADE_BASELINE_PATH: ${{ github.workspace }}/.upgrade/extension
          ASTERFOLD_UPGRADE_TARGET_ZIP: ${{ github.workspace }}/release/Asterfold-Chrome.zip
          ASTERFOLD_UPGRADE_PROFILE_PATH: ${{ github.workspace }}/.upgrade/profile
        run: npm run test:upgrade
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failure-evidence-linux
          path: |
            test-results
            playwright-report
            coverage
          if-no-files-found: ignore
      - name: Upload Linux reproducibility subjects
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux
          path: |
            release/Asterfold-Chrome.zip
            release/chrome-unpacked.zip
            release/extension-source.zip
            release/Asterfold-Store-Assets.zip
            release/sbom.spdx.json
          if-no-files-found: error

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Windows version consistency
        run: npm run validate:version
      - name: Windows source security scan
        run: npm run scan:source
      - name: Windows production build
        run: npm run build
      - name: Windows generated manifest consistency
        shell: pwsh
        run: $env:REQUIRE_GENERATED_MANIFEST='true'; npm run validate:version
      - name: Windows Store asset validation
        run: npm run validate:store
      - name: Windows deterministic release verification
        run: node scripts/verify-release.mjs
      - name: Upload Windows reproducibility subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows
          path: |
            release/Asterfold-Chrome.zip
            release/chrome-unpacked.zip
            release/extension-source.zip
            release/Asterfold-Store-Assets.zip
            release/sbom.spdx.json
          if-no-files-found: error

  cross-platform-reproducibility:
    needs: [validate, windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          name: release-linux
          path: linux
      - name: Download Windows artifacts
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          name: release-windows
          path: windows
      - name: Compare exact bytes
        shell: bash
        run: |
          set -euo pipefail
          for name in Asterfold-Chrome.zip chrome-unpacked.zip extension-source.zip Asterfold-Store-Assets.zip sbom.spdx.json; do
            cmp "linux/$name" "windows/$name"
            sha256sum "linux/$name" "windows/$name"
          done

  publish-v3-0-1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [cross-platform-reproducibility]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
      issues: write
    env:
      SOURCE_SHA: 642e921ca0fd47e56d0d82c5b9609e8986915c3c
      SOURCE_CI_RUN: "30427609096"
      RELEASE_TAG: v3.0.1
    steps:
      - name: Check out exact annotated tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v3.0.1
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag and exact source gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          test "$(git cat-file -t refs/tags/$RELEASE_TAG)" = tag
          test "$(git rev-list -n 1 refs/tags/$RELEASE_TAG)" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&status=completed&per_page=100" > workflow-runs.json
          EXPECTED_SOURCE_SHA="$SOURCE_SHA" REQUIRED_WORKFLOWS=CI,CodeQL node scripts/verify-required-workflows.mjs workflow-runs.json
          rm workflow-runs.json

      - name: Download exact verified release subjects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-linux release-windows release
          mkdir release-linux release-windows release
          gh run download "$SOURCE_CI_RUN" --repo "$GITHUB_REPOSITORY" --name release-linux --dir release-linux
          gh run download "$SOURCE_CI_RUN" --repo "$GITHUB_REPOSITORY" --name release-windows --dir release-windows
          for name in Asterfold-Chrome.zip chrome-unpacked.zip extension-source.zip Asterfold-Store-Assets.zip sbom.spdx.json; do
            cmp "release-linux/$name" "release-windows/$name"
            cp "release-linux/$name" "release/$name"
          done
          unzip -q release/chrome-unpacked.zip -d release

      - name: Generate provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          env -u GITHUB_SHA RELEASE_TAG="$RELEASE_TAG" node scripts/generate-provenance.mjs
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { checksumLine } from './scripts/release-lib.mjs';
          const names = ['Asterfold-Chrome.zip', 'chrome-unpacked.zip', 'extension-source.zip', 'Asterfold-Store-Assets.zip', 'sbom.spdx.json', 'provenance.json'];
          const lines = await Promise.all(names.map((name) => checksumLine(resolve('release', name))));
          await writeFile('release/checksums.txt', `${lines.join('\n')}\n`, 'utf8');
NODE
          node scripts/validate-release-package.mjs
          EXPECTED_SOURCE_SHA="$SOURCE_SHA" EXPECTED_TAG="$RELEASE_TAG" node scripts/verify-provenance.mjs release

      - name: Detect existing Release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest release assets
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-checksums: release/checksums.txt

      - name: Attest Store package SBOM
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: release/Asterfold-Chrome.zip
          sbom-path: release/sbom.spdx.json

      - name: Publish Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          store_sha="$(sha256sum release/Asterfold-Chrome.zip | cut -d' ' -f1)"
          cp docs/release/release-notes.md release-notes.md
          printf '\n### Verification\n\n`Asterfold-Chrome.zip` SHA-256: `%s`\n' "$store_sha" >> release-notes.md
          gh release create "$RELEASE_TAG" \
            release/Asterfold-Chrome.zip \
            release/chrome-unpacked.zip \
            release/extension-source.zip \
            release/Asterfold-Store-Assets.zip \
            release/checksums.txt \
            release/provenance.json \
            release/sbom.spdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Asterfold 3.0.1" \
            --notes-file release-notes.md \
            --latest

      - name: Verify published Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published-release && mkdir published-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published-release
          expected=(Asterfold-Chrome.zip chrome-unpacked.zip extension-source.zip Asterfold-Store-Assets.zip checksums.txt provenance.json sbom.spdx.json)
          mapfile -t actual < <(find published-release -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${sorted_expected[*]}"
          for name in "${expected[@]}"; do cmp "release/$name" "published-release/$name"; done
          (cd published-release && sha256sum --check checksums.txt)
          EXPECTED_SOURCE_SHA="$SOURCE_SHA" EXPECTED_TAG="$RELEASE_TAG" node scripts/verify-provenance.mjs published-release
          gh attestation verify published-release/Asterfold-Chrome.zip --repo "$GITHUB_REPOSITORY"

      - name: Report successful publication
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          sha="$(grep '  Asterfold-Chrome.zip$' published-release/checksums.txt | cut -d' ' -f1)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/22/comments" -f body="## Asterfold 3.0.1 published\n\n- Release: $url\n- Tag source: \`$SOURCE_SHA\`\n- Asterfold-Chrome.zip SHA-256: \`$sha\`\n- Checksums, provenance and attestation: verified" >/dev/null

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@1e966ba708e4b64bb0c9bfb7abb5a232840be16a
        with:
          fail-on-severity: high
