name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finalize-v3.2.0-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize-v3-2-0-metadata:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/asterfold-v3.2.0-onboarding'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3.2.0-onboarding
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Generate 3.2.0 release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "3.2.0"
          npm install --package-lock-only --ignore-scripts
          node scripts/finalize-v3.2.0.mjs
          python <<'PY'
          from pathlib import Path
          for name in ['docs/release/release-notes.md', 'docs/release/3.2.0-test-plan.md']:
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          npm run validate:version
      - name: Commit non-workflow release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json README.md e2e/upgrade.spec.ts \
            docs/release/install.md docs/release/release-notes.md docs/release/3.2.0-test-plan.md \
            docs/security/privacy.md docs/store/privacy.html docs/store/submission-checklist.md \
            store-assets/listing/submission-values.md
          git diff --cached --check
          git commit -m "release: prepare Asterfold 3.2.0 metadata"
          git push origin HEAD:agent/asterfold-v3.2.0-onboarding
