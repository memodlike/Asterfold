name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The verified patch payload is now complete; this job removes itself after application.
jobs:
  apply-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/final-store-readiness-v2.2.3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      applied: ${{ steps.apply.outputs.applied }}
    steps:
      - name: Check out source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Verify and apply remaining patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .agent-patch-v2/part04 ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat .agent-patch-v2/part* > /tmp/asterfold.patch.gz.b64
          base64 --decode /tmp/asterfold.patch.gz.b64 > /tmp/asterfold.patch.gz
          echo "32498cfac4177b05a8840ab0e2e3fa16be3d5553a8aa0fce09728dfa156a6cb5  /tmp/asterfold.patch.gz" | sha256sum -c -
          gzip -dc /tmp/asterfold.patch.gz > /tmp/asterfold.patch
          git apply --check /tmp/asterfold.patch
          git apply /tmp/asterfold.patch
          rm -rf .agent-patch .agent-patch-v2
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/apply-final-readiness-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Chrome Store readiness hardening"
          git push origin HEAD
          echo "applied=true" >> "$GITHUB_OUTPUT"

  validate:
    needs: apply-patch
    if: always() && needs.apply-patch.outputs.applied != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm run audit:production
      - name: Full development dependency audit
        continue-on-error: true
        run: npm audit --json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Chrome Web Store asset validation
        run: node scripts/validate-store-assets.mjs
      - run: npm run release:repro
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real MV3, accessibility and visual E2E
        run: npm run test:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failure-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
      - name: Upload release
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asterfold-release
          path: |
            release/Asterfold-Chrome.zip
            release/chrome-unpacked.zip
            release/extension-source.zip
            release/Asterfold-Store-Assets.zip
            release/checksums.txt
          if-no-files-found: error

  windows-release:
    needs: apply-patch
    if: always() && needs.apply-patch.outputs.applied != 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:repro

  dependency-review:
    needs: apply-patch
    if: always() && github.event_name == 'pull_request' && needs.apply-patch.outputs.applied != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@1e966ba708e4b64bb0c9bfb7abb5a232840be16a
        with:
          fail-on-severity: high
