name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  prepare-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out preview branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/newtab-startup-flash-3.1.3
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Synchronize patched lockfile and 3.1.3 metadata
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          python3 - <<'PY'
          import re
          from pathlib import Path

          replacements = {
            'docs/security/privacy.md': [('Policy version: 3.1.2', 'Policy version: 3.1.3'), ('Applies to: Asterfold 3.1.2', 'Applies to: Asterfold 3.1.3')],
            'docs/store/privacy.html': [('Policy version: 3.1.2', 'Policy version: 3.1.3'), ('Asterfold 3.1.2', 'Asterfold 3.1.3')],
            'docs/store/submission-checklist.md': [('Current version: 3.1.2', 'Current version: 3.1.3')],
            'store-assets/listing/submission-values.md': [('Current version: 3.1.2', 'Current version: 3.1.3')],
            'docs/release/install.md': [('Install Asterfold 3.1.2', 'Install Asterfold 3.1.3')],
            'docs/security/permissions.md': [('Asterfold 3.1.2', 'Asterfold 3.1.3')],
            'docs/security/review.md': [('Asterfold 3.1.2', 'Asterfold 3.1.3')],
          }
          for path, pairs in replacements.items():
            file = Path(path)
            text = file.read_text()
            for old, new in pairs:
              text = text.replace(old, new)
            file.write_text(text)

          release_path = Path('docs/release/release-notes.md')
          previous = release_path.read_text()
          if not previous.startswith('# Asterfold 3.1.3'):
            previous = previous.replace('# Asterfold 3.1.2', '## 3.1.2 — Original-quality uploaded wallpapers', 1)
            release_path.write_text('''# Asterfold 3.1.3

## Flash-free new-tab startup

- Paints a dark critical surface before React and the main stylesheet load.
- Restores a strictly validated local visual snapshot for the canvas and bundled wallpaper.
- Keeps React hidden until IndexedDB, the selected theme and wallpaper resolve, then reveals the final workspace once.
- Applies final theme variables before the first visible React frame and keeps a five-second failure fallback.

## Entrance motion

- Fades the final wallpaper without animating blur or filters.
- Introduces a restrained board stagger and launcher rise using opacity and transform only.
- Runs only during initial startup and respects both reduced-motion and the Asterfold motion preference.

## Verification

- Adds unit/static coverage for snapshot validation, denied storage, critical resource ordering and reduced-motion behavior.
- Adds a real unpacked-MV3 frame-sampled regression for white flashes, visible loading frames and opacity reversals.
- Retains audit, source scan, typecheck, lint, coverage, Store validation, deterministic packaging, MV3 E2E, stress and exact upgrade checks.

## Previous release details

''' + previous)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace('Asterfold 3.1.2 produces a reproducible', 'Asterfold 3.1.3 produces a reproducible', 1)
          readme = readme.replace('**Asterfold 3.1.2** preserves user-uploaded wallpapers at their exact original resolution, format and byte quality, while keeping a separate Full HD software-rendering fallback and the verified local-first release pipeline.', '**Asterfold 3.1.3** removes new-tab white/dark flashing with a critical first-paint surface, waits for the final theme and wallpaper before revealing React, and adds a restrained reduced-motion-aware entrance sequence while retaining the 3.1.2 original-quality wallpaper pipeline.', 1)
          marker = '## Version history\n\n'
          if '**v3.1.3 — Flash-free new-tab startup.**' not in readme:
            start = readme.index(marker) + len(marker)
            end = readme.index('\n\nThe newest published build', start)
            lines = readme[start:end].splitlines()
            bumped = []
            for line in lines:
              match = re.match(r'^(\d+)\.\s+(.*)$', line)
              bumped.append(f"{int(match.group(1)) + 1}. {match.group(2)}" if match else line)
            current = '1. **v3.1.3 — Flash-free new-tab startup.** Adds a critical dark first paint, validated visual snapshot, layout-timed theme application, one-time compositor-safe entrance motion, reduced-motion support, and a frame-sampled MV3 regression.'
            readme = readme[:start] + current + '\n' + '\n'.join(bumped) + readme[end:]
          readme_path.write_text(readme)

          versioning_path = Path('docs/release/versioning.md')
          versioning = versioning_path.read_text()
          anchor = '`3.1.2` is the original-quality wallpaper patch release. It follows the 3.1.1 wallpaper/UI polish build and preserves uploaded raster sources without changing extension permissions or the local-first data model.\n'
          if '`3.1.3` is the flash-free' not in versioning:
            versioning = versioning.replace(anchor, anchor + '\n`3.1.3` is the flash-free new-tab startup patch. It adds a critical first-paint surface, waits for the resolved theme and wallpaper before revealing the workspace, and keeps entrance motion compositor-safe and reduced-motion-aware.\n')
          versioning = versioning.replace('for example `v3.1.2`', 'for example `v3.1.3`').replace('numeric version `3.1.2`', 'numeric version `3.1.3`')
          versioning_path.write_text(versioning)

          runtime_path = Path('tests/runtimeCoverage.test.ts')
          runtime = runtime_path.read_text()
          anchor = '    document.documentElement.removeAttribute("data-performance");\n'
          if 'removeAttribute("data-asterfold-ready")' not in runtime:
            runtime = runtime.replace(anchor, anchor + '    document.documentElement.removeAttribute("data-asterfold-ready");\n    document.documentElement.removeAttribute("data-asterfold-entering");\n    document.documentElement.removeAttribute("data-asterfold-boot");\n    localStorage.removeItem("asterfold:startup-theme:v1");\n')
          runtime_path.write_text(runtime)
          Path('.github/workflows/prepare-3.1.3-test-build.yml').unlink(missing_ok=True)
          PY
          node -e "const p=require('./package-lock.json'); if(p.version!=='3.1.3'||p.packages[''].version!=='3.1.3'||p.packages['node_modules/brace-expansion'].version!=='5.0.9') process.exit(1)"
          git diff --check
      - name: Commit prepared preview
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: synchronize Asterfold 3.1.3 preview metadata'
          git push origin HEAD:fix/newtab-startup-flash-3.1.3
