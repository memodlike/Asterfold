name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finalize-v3.2.0-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize-v3-2-0-metadata:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/asterfold-v3.2.0-onboarding'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3.2.0-onboarding
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Restore CI and finalize 3.2.0 metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('publish-release-3-1-4', 'publish-release-3-2-0')
          text = text.replace('3.1.4', '3.2.0')
          path.write_text(text, encoding='utf-8')
          PY
          test "$(node -p "require('./package.json').version")" = "3.2.0"
          npm install --package-lock-only --ignore-scripts
          node scripts/finalize-v3.2.0.mjs
          rm -f scripts/finalize-v3.2.0.mjs .github/workflows/bump-v3.2.0.yml
          npm run validate:version
      - name: Commit finalized 3.2.0 metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: prepare Asterfold 3.2.0"
          git push origin HEAD:agent/asterfold-v3.2.0-onboarding
