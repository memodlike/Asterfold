name: Apply deterministic MV3 locale fix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: e2e-locale-fix-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'memodlike' && github.event.pull_request.head.ref == 'agent/chrome-store-readiness-2.2.3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/chrome-store-readiness-2.2.3
          fetch-depth: 2
          persist-credentials: true
      - name: Apply E2E locale isolation patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=nowarn .e2e-locale.patch
          rm -f .e2e-locale.patch
          git checkout HEAD^ -- .github/workflows/ci.yml
          git add -A
          git config user.name "Asterfold E2E Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test: isolate MV3 locale state"
          git push origin HEAD:agent/chrome-store-readiness-2.2.3
