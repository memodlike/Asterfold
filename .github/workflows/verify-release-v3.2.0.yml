name: Verify Asterfold 3.2.0 Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-release-v3.2.0.yml

permissions:
  contents: write

concurrency:
  group: verify-asterfold-v3.2.0-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for published release and verify metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(Asterfold-Chrome.zip Asterfold-Store-Assets.zip checksums.txt chrome-unpacked.zip extension-source.zip provenance.json sbom.spdx.json)
          release_json=""
          for attempt in $(seq 1 180); do
            if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v3.2.0" 2>/dev/null)"; then
              draft="$(jq -r '.draft' <<<"$release_json")"
              prerelease="$(jq -r '.prerelease' <<<"$release_json")"
              asset_count="$(jq '.assets | length' <<<"$release_json")"
              if [[ "$draft" == "false" && "$prerelease" == "false" && "$asset_count" -eq 7 ]]; then
                break
              fi
            fi
            release_json=""
            sleep 5
          done
          test -n "$release_json"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "v3.2.0"
          test "$(jq -r '.name' <<<"$release_json")" = "Asterfold 3.2.0"
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "9f46b709f8c10a3986a67f69db399f6b5db3cd72"
          mapfile -t actual < <(jq -r '.assets[].name' <<<"$release_json" | sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${sorted_expected[*]}"
          echo "release_id=$(jq -r '.id' <<<"$release_json")" >> "$GITHUB_OUTPUT"
          echo "published_at=$(jq -r '.published_at' <<<"$release_json")" >> "$GITHUB_OUTPUT"
          echo "html_url=$(jq -r '.html_url' <<<"$release_json")" >> "$GITHUB_OUTPUT"

      - name: Download and verify all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verified-release
          mkdir verified-release
          gh release download v3.2.0 --repo "$GITHUB_REPOSITORY" --dir verified-release
          (cd verified-release && sha256sum --check checksums.txt)
          test -s verified-release/Asterfold-Chrome.zip
          test -s verified-release/chrome-unpacked.zip
          test -s verified-release/extension-source.zip
          test -s verified-release/Asterfold-Store-Assets.zip
          test -s verified-release/provenance.json
          test -s verified-release/sbom.spdx.json
          node -e "const p=require('./verified-release/provenance.json'); if(p.version!=='3.2.0'||p.tag!=='v3.2.0'||p.sourceSha!=='9f46b709f8c10a3986a67f69db399f6b5db3cd72') process.exit(1)"

      - name: Record verified publication
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          HTML_URL: ${{ steps.release.outputs.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/release
          cat > docs/release/v3.2.0-published.json <<EOF
          {
            "version": "3.2.0",
            "tag": "v3.2.0",
            "releaseId": "$RELEASE_ID",
            "publishedAt": "$PUBLISHED_AT",
            "url": "$HTML_URL",
            "targetCommit": "9f46b709f8c10a3986a67f69db399f6b5db3cd72",
            "assetsVerified": 7,
            "checksumsVerified": true,
            "provenanceVerified": true
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/v3.2.0-published.json
          git commit -m "chore(release): record verified Asterfold 3.2.0 publication"
          git push origin HEAD:main
