name: Fix Settings language expectation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: fix-settings-language-expectation
  cancel-in-progress: true

jobs:
  fix:
    if: github.head_ref == 'agent/asterfold-v3-store-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Correct localized language expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/settingsDialogBehavior.test.ts')
          text = path.read_text()
          old = 'screen.getByRole("button", { name: "Russian" })'
          new = 'screen.getByRole("button", { name: "Русский" })'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one English-language assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate correction
        run: |
          npm run typecheck
          npm run lint
          npx vitest run tests/settingsDialogBehavior.test.ts
      - name: Commit ordinary test fix and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-settings-language-expectation.yml
          rm -f .github/fix-settings-language-expectation.trigger
          git add tests/settingsDialogBehavior.test.ts .github
          git diff --cached --check
          git config user.name 'Asterfold Release Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: use localized Settings language label'
          git push origin HEAD:refs/heads/agent/asterfold-v3-store-hardening
