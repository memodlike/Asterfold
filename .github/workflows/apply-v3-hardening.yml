name: Apply Asterfold 3.0.0 hardening patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-v3-hardening-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/asterfold-v3-store-hardening-d8bed28'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Decode and record transport digests
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cat .github/asterfold-v3-patch/part* > /tmp/asterfold-v3.patch.gz.b64
          base64 --decode /tmp/asterfold-v3.patch.gz.b64 | gzip --decompress > /tmp/asterfold-v3.patch
          {
            echo 'encoded:'
            sha256sum /tmp/asterfold-v3.patch.gz.b64
            wc -c /tmp/asterfold-v3.patch.gz.b64
            echo 'decoded:'
            sha256sum /tmp/asterfold-v3.patch
            wc -c /tmp/asterfold-v3.patch
          } > .github/asterfold-v3-patch/actual-sha.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/asterfold-v3-patch/actual-sha.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record patch transport digest'
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Upload decoded patch for byte comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: decoded-v3-patch
          path: /tmp/asterfold-v3.patch
          if-no-files-found: error
          retention-days: 1

      - name: Verify decoded patch SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo '15417f3282603300b196b0d5f7fecb535dcdcfc19b6e9657b8e98cc52ab5917e  /tmp/asterfold-v3.patch' | sha256sum --check

      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/asterfold-v3.patch
          git apply /tmp/asterfold-v3.patch
          rm -rf .github/asterfold-v3-patch
          rm .github/workflows/apply-v3-hardening.yml
          git add -A
          git diff --cached --check
          test -z "$(git ls-files '.github/asterfold-v3-patch/**' '.github/workflows/apply-v3-hardening.yml')"

      - name: Commit normal source tree
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git commit -m 'release: prepare Asterfold 3.0.0 for Chrome Web Store'
          git push origin "HEAD:${BRANCH}"
