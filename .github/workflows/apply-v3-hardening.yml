name: Apply Asterfold 3.0.0 hardening patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-v3-hardening-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/asterfold-v3-store-hardening-d8bed28'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and decode patch transport
        shell: bash
        run: |
          set -euo pipefail
          cat .github/asterfold-v3-patch/part* > /tmp/asterfold-v3.patch.gz.b64
          echo 'd45d983dfe517b64c83fa8f6de90d77e5a99e7b4a05dbb0c1f60f7c8ecc0cf32  /tmp/asterfold-v3.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/asterfold-v3.patch.gz.b64 | gzip --decompress > /tmp/asterfold-v3.patch
          echo 'ddd9cad65955b073ee7c9271ea86dbfca4f97b3c1d940b11a244373f5d4136a1  /tmp/asterfold-v3.patch' | sha256sum --check
          test "$(wc -c < /tmp/asterfold-v3.patch)" -eq 211106

      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/asterfold-v3.patch
          git apply /tmp/asterfold-v3.patch
          rm -rf .github/asterfold-v3-patch
          rm .github/workflows/apply-v3-hardening.yml
          git add -A
          git diff --cached --check
          test -z "$(git ls-files '.github/asterfold-v3-patch/**' '.github/workflows/apply-v3-hardening.yml')"

      - name: Commit normal source tree
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: prepare Asterfold 3.0.0 for Chrome Web Store'
          git push origin "HEAD:${BRANCH}"
