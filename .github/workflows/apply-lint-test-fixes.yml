name: Apply verified lint test fixes

on:
  push:
    branches:
      - agent/asterfold-v3-store-hardening
    paths:
      - .github/patches/lint-test-fixes.patch
      - .github/patches/lint-test-fixes.trigger
      - .github/workflows/apply-lint-test-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-lint-test-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'ead74fc832721968256e27e29327e8cc58e8e4a8ad37c071d13d9820b0136f9e  .github/patches/lint-test-fixes.patch' | sha256sum --check
          git apply --check .github/patches/lint-test-fixes.patch
          git apply .github/patches/lint-test-fixes.patch
          rm -f .github/patches/lint-test-fixes.patch
          rm -f .github/patches/lint-test-fixes.trigger
          rm -f .github/workflows/apply-lint-test-fixes.yml
          git add tests/runtimeCoverage.test.ts tests/workspaceAppOrchestration.test.ts tests/workspaceIntegrationCoverage.test.ts .github
          git diff --cached --check
      - name: Commit normal source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Asterfold Release Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: satisfy strict lint in coverage suites'
          git push origin HEAD:refs/heads/agent/asterfold-v3-store-hardening
