name: Apply Asterfold 3.2.1 store metadata patch

on:
  push:
    branches: ["agent/asterfold-3.2.1-store-listing-optimization"]
    paths:
      - .github/workflows/apply-store-metadata-v3.2.1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-3.2.1-store-listing-optimization
          fetch-depth: 0

      - name: Apply reviewed metadata patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/asterfold-3.2.1.patch.gz.b64 | gzip -d > /tmp/asterfold-3.2.1.patch
          git apply --check /tmp/asterfold-3.2.1.patch
          git apply /tmp/asterfold-3.2.1.patch
          rm .github/asterfold-3.2.1.patch.gz.b64
          rm .github/workflows/apply-store-metadata-v3.2.1.yml
          git diff --check

      - name: Run dependency-free release checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:version
          npm run validate:store
          npm run scan:source
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = fs.readFileSync('wxt.config.ts', 'utf8');
          const expected = [
            'name: "Asterfold — Visual Bookmark Workspace"',
            'short_name: "Asterfold"',
            'permissions: ["activeTab", "favicon", "alarms", "contextMenus", "storage"]',
            'optional_permissions: ["bookmarks"]',
            'host_permissions: []',
          ];
          for (const value of expected) {
            if (!config.includes(value)) throw new Error(`Missing expected manifest source: ${value}`);
          }
          const en = 'Turn Chrome New Tab into a visual bookmark workspace with Pages, Boards, search, Quick Save, and local-first storage.';
          const ru = 'Новая вкладка Chrome как визуальное пространство закладок со Страницами, Блоками, поиском, Quick Save и локальным хранением.';
          if (en.length !== 117 || en.length > 132) throw new Error(`English summary length: ${en.length}`);
          if (ru.length !== 124 || ru.length > 132) throw new Error(`Russian summary length: ${ru.length}`);
          if ('Asterfold — Visual Bookmark Workspace'.length !== 37) throw new Error('Unexpected extension name length');
          NODE

      - name: Commit only the release patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/release/install.md docs/release/release-notes.md docs/security/privacy.md docs/store/privacy.html docs/store/submission-checklist.md package.json package-lock.json store-assets/listing/store-listing-en.md store-assets/listing/store-listing-ru.md store-assets/listing/submission-values.md wxt.config.ts
          git add -u .github/asterfold-3.2.1.patch.gz.b64 .github/workflows/apply-store-metadata-v3.2.1.yml
          git diff --cached --check
          git commit -m "release: Asterfold 3.2.1 store listing optimization"
          git push origin HEAD:agent/asterfold-3.2.1-store-listing-optimization
