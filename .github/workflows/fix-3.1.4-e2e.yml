name: Fix Asterfold 3.1.4 E2E

on:
  push:
    branches: [fix/opaque-settings-controls-3.1.4]
    paths: [.github/workflows/fix-3.1.4-e2e.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/opaque-settings-controls-3.1.4
      - name: Update custom dropdown and upgrade E2E
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          extension = Path('e2e/extension.spec.ts')
          text = extension.read_text()
          old = '    await popup.getByLabel("Страница").selectOption("empty-page");'
          new = '''    const pageSelect = popup.getByRole("combobox", { name: "Страница" });
              await pageSelect.click();
              await popup.getByRole("option", { name: "Empty", exact: true }).click();'''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('Missing stale popup selectOption line')
          extension.write_text(text.replace(old, new))

          upgrade = Path('e2e/upgrade.spec.ts')
          text = upgrade.read_text()
          replacements = {
              'Must survive 3.1.3': 'Must survive 3.1.4',
              'upgraded to 3.1.3': 'upgraded to 3.1.4',
              'expect(targetManifest.version).toBe("3.1.3");': 'expect(targetManifest.version).toBe("3.1.4");',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing upgrade text: {old}')
              text = text.replace(old, new)
          upgrade.write_text(text)
          PY
          rm .github/workflows/fix-3.1.4-e2e.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add e2e/extension.spec.ts e2e/upgrade.spec.ts .github/workflows/fix-3.1.4-e2e.yml
          git commit -m "test: exercise custom dropdown in MV3 E2E"
          git push origin HEAD:fix/opaque-settings-controls-3.1.4
