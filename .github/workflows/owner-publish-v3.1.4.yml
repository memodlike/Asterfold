name: Owner Publish Asterfold 3.1.4

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: owner-publish-v3.1.4
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.pull_request.head.ref == 'release/publish-v3.1.4-owner-authorized' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.title == 'release: publish Asterfold 3.1.4 as Latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve exact trusted main SHA
        id: target
        env:
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Record owner-authorized publication start
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Asterfold 3.1.4 owner-authorized publication started from trusted main SHA \`$TARGET_SHA\`. Linux and Windows release gates are running."

  linux-release:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Check out exact trusted release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete release gates
        env:
          TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
          RELEASE_TAG: v3.1.4
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(node -p "require('./package.json').version")" = "3.1.4"
          export GITHUB_SHA="$TARGET_SHA"
          npm run audit:production
          npm run audit:development
          npm run scan:source
          npm run typecheck
          npm run lint
          npm run test:coverage
          npm run validate:store
          npm run release:repro
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:stress
          rm -rf .upgrade && mkdir -p .upgrade/extension
          gh release download v2.2.3 --repo "$GITHUB_REPOSITORY" --pattern Asterfold-Chrome.zip --dir .upgrade
          echo "e666c0e40ca2bcd1631b04e3b9087e38b26f71336664ecfc475ee8b4d610920a  .upgrade/Asterfold-Chrome.zip" | sha256sum --check
          unzip -q .upgrade/Asterfold-Chrome.zip -d .upgrade/extension
          ASTERFOLD_UPGRADE_BASELINE_PATH="$GITHUB_WORKSPACE/.upgrade/extension" \
          ASTERFOLD_UPGRADE_TARGET_ZIP="$GITHUB_WORKSPACE/release/Asterfold-Chrome.zip" \
          ASTERFOLD_UPGRADE_PROFILE_PATH="$GITHUB_WORKSPACE/.upgrade/profile" \
          npm run test:upgrade
      - name: Upload Linux release subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: owner-release-linux-v3.1.4
          path: |
            release/Asterfold-Chrome.zip
            release/chrome-unpacked.zip
            release/extension-source.zip
            release/Asterfold-Store-Assets.zip
            release/sbom.spdx.json
            release/provenance.json
            release/checksums.txt
          if-no-files-found: error

  windows-release:
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact trusted release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate deterministic Windows release
        env:
          TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
          RELEASE_TAG: v3.1.4
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:TARGET_SHA) { throw 'Exact source SHA mismatch' }
          $env:GITHUB_SHA = $env:TARGET_SHA
          npm run validate:version
          npm run scan:source
          npm run build
          $env:REQUIRE_GENERATED_MANIFEST='true'
          npm run validate:version
          npm run validate:store
          node scripts/verify-release.mjs
      - name: Upload Windows release subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: owner-release-windows-v3.1.4
          path: |
            release/Asterfold-Chrome.zip
            release/chrome-unpacked.zip
            release/extension-source.zip
            release/Asterfold-Store-Assets.zip
            release/sbom.spdx.json
            release/provenance.json
            release/checksums.txt
          if-no-files-found: error

  publish:
    needs: [authorize, linux-release, windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      attestations: write
      id-token: write
    steps:
      - name: Check out exact trusted release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download Linux release subjects
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          name: owner-release-linux-v3.1.4
          path: release
      - name: Download Windows release subjects
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          name: owner-release-windows-v3.1.4
          path: windows-release
      - name: Verify exact cross-platform package
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
          RELEASE_TAG: v3.1.4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_SHA"
          test "$(node -p "require('./package.json').version")" = "3.1.4"
          for name in Asterfold-Chrome.zip chrome-unpacked.zip extension-source.zip Asterfold-Store-Assets.zip sbom.spdx.json provenance.json checksums.txt; do
            cmp "release/$name" "windows-release/$name"
          done
          (cd release && sha256sum --check checksums.txt)
          EXPECTED_SOURCE_SHA="$TARGET_SHA" EXPECTED_TAG="$RELEASE_TAG" node scripts/verify-provenance.mjs release
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists without a verified release."
            exit 1
          fi
      - name: Attest release assets
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-checksums: release/checksums.txt
      - name: Attest checksums manifest
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: release/checksums.txt
      - name: Attest Store package SBOM
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: release/Asterfold-Chrome.zip
          sbom-path: release/sbom.spdx.json
      - name: Publish Asterfold 3.1.4 as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
          RELEASE_TAG: v3.1.4
        shell: bash
        run: |
          set -euo pipefail
          store_sha="$(sha256sum release/Asterfold-Chrome.zip | cut -d' ' -f1)"
          cp docs/release/release-notes.md release-notes.md
          printf '\n### Verification\n\n`Asterfold-Chrome.zip` SHA-256: `%s`\n\nBuild provenance, SBOM and checksums are attached. GitHub-generated source archives are not the Chrome installation package.\n' "$store_sha" >> release-notes.md
          gh release create "$RELEASE_TAG" \
            release/Asterfold-Chrome.zip \
            release/chrome-unpacked.zip \
            release/extension-source.zip \
            release/Asterfold-Store-Assets.zip \
            release/checksums.txt \
            release/provenance.json \
            release/sbom.spdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Asterfold 3.1.4" \
            --notes-file release-notes.md \
            --latest
      - name: Download and verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
          RELEASE_TAG: v3.1.4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published-release && mkdir published-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published-release
          expected=(Asterfold-Chrome.zip chrome-unpacked.zip extension-source.zip Asterfold-Store-Assets.zip checksums.txt provenance.json sbom.spdx.json)
          mapfile -t actual < <(find published-release -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${sorted_expected[*]}"
          for name in "${expected[@]}"; do cmp "release/$name" "published-release/$name"; done
          (cd published-release && sha256sum --check checksums.txt)
          EXPECTED_SOURCE_SHA="$TARGET_SHA" EXPECTED_TAG="$RELEASE_TAG" node scripts/verify-provenance.mjs published-release
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url,assets)"
          RELEASE_JSON="$release_json" TARGET_SHA="$TARGET_SHA" node --input-type=module <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON);
          if (release.tagName !== 'v3.1.4') throw new Error('Published tag mismatch');
          if (release.isDraft || release.isPrerelease) throw new Error('Release is not final');
          if (release.targetCommitish !== process.env.TARGET_SHA) throw new Error(`Release target mismatch: ${release.targetCommitish}`);
          if ((release.assets ?? []).length !== 7) throw new Error(`Expected 7 assets, got ${(release.assets ?? []).length}`);
          NODE
          gh attestation verify published-release/Asterfold-Chrome.zip --repo "$GITHUB_REPOSITORY"
      - name: Upload verified release for direct download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: owner-published-release-v3.1.4
          path: published-release
          if-no-files-found: error
      - name: Report successful publication
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          release_url="$(gh release view v3.1.4 --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Asterfold 3.1.4 RELEASED and marked Latest. Target: \`$TARGET_SHA\`. Release: $release_url"

  report-failure:
    needs: [authorize, linux-release, windows-release, publish]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      (needs.linux-release.result != 'success' || needs.windows-release.result != 'success' || needs.publish.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Report publication failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Asterfold 3.1.4 publication failed. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
