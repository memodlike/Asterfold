name: Validate Asterfold 3.2.2 RC

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-rc:
    if: github.event.pull_request.head.ref == 'release/asterfold-3.2.2-design-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate version and security
        run: |
          npm run validate:version
          npm run audit:production
          npm run audit:development
          npm run scan:source
      - name: Static and unit gates
        run: |
          npm run typecheck
          npm run lint
          npm run test:coverage
      - name: Build and reproducibility gate
        run: |
          npm run build
          REQUIRE_GENERATED_MANIFEST=true npm run validate:version
          npm run validate:store
          npm run release:repro
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real MV3, accessibility, visual and stress gates
        run: |
          npm run test:e2e
          npm run test:stress
      - name: Prepare exact 2.2.3 upgrade fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .upgrade && mkdir -p .upgrade/extension
          gh release download v2.2.3 --repo "$GITHUB_REPOSITORY" --pattern Asterfold-Chrome.zip --dir .upgrade
          echo "e666c0e40ca2bcd1631b04e3b9087e38b26f71336664ecfc475ee8b4d610920a  .upgrade/Asterfold-Chrome.zip" | sha256sum --check
          unzip -q .upgrade/Asterfold-Chrome.zip -d .upgrade/extension
      - name: Exact 2.2.3 upgrade E2E
        run: |
          ASTERFOLD_UPGRADE_BASELINE_PATH="$GITHUB_WORKSPACE/.upgrade/extension" \
          ASTERFOLD_UPGRADE_TARGET_ZIP="$GITHUB_WORKSPACE/release/Asterfold-Chrome.zip" \
          ASTERFOLD_UPGRADE_PROFILE_PATH="$GITHUB_WORKSPACE/.upgrade/profile" \
          npm run test:upgrade
