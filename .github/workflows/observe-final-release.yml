name: Observe final main release

on:
  push:
    branches: [fix/asterfold-v3-pages-deploy]
    paths:
      - .github/release-observer/**
      - .github/workflows/observe-final-release.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: observe-final-main-release-v2
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out observer branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/asterfold-v3-pages-deploy
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Observe and verify final release
        id: observer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node .github/release-observer/observe-final-release.mjs
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verified published release
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: final-release-observer-${{ github.run_id }}
          path: .release-observer-output
          if-no-files-found: error

      - name: Commit observer report and remove transport
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/audit/observer
          cp .release-observer-output/final-release-status.json docs/audit/observer/final-release-status-v3.0.1.json
          git add docs/audit/observer/final-release-status-v3.0.1.json
          git rm .github/release-observer/observe-final-release.mjs .github/workflows/observe-final-release.yml
          test ! -e .github/release-observer/TRIGGER || git rm .github/release-observer/TRIGGER
          git diff --cached --check
          git commit -m "docs: record verified Asterfold 3.0.1 release"
          git push origin HEAD:fix/asterfold-v3-pages-deploy

      - name: Enforce observer result
        shell: bash
        run: test "${{ steps.observer.outputs.status }}" = "0"
