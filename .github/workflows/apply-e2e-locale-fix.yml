name: Apply deterministic first-use E2E fix

on:
  push:
    branches: [agent/asterfold-v3-store-hardening]
    paths:
      - .github/e2e-fix/**
      - .github/workflows/apply-e2e-locale-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-e2e-locale-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Apply exact transform
        run: python .github/e2e-fix/apply.py
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Zero-warning lint
        run: npm run lint
      - name: Commit final test and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/extension.spec.ts
          git rm .github/e2e-fix/apply.py .github/workflows/apply-e2e-locale-fix.yml
          git diff --cached --check
          git commit -m "test: make first-use locale deterministic"
          git push origin HEAD:agent/asterfold-v3-store-hardening
