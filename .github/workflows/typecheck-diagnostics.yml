name: Typecheck diagnostics

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    if: github.actor == 'memodlike' && github.event.pull_request.head.ref == 'agent/chrome-store-readiness-2.2.3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/chrome-store-readiness-2.2.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report TypeScript errors
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          head -c 12000 /tmp/typecheck.log > /tmp/typecheck-truncated.log
          jq -Rs '{body: "<!-- asterfold-typecheck-diagnostics -->\n### TypeScript diagnostics\n```text\n" + . + "\n```"}' /tmp/typecheck-truncated.log > /tmp/comment.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data-binary @/tmp/comment.json
          exit "$status"
