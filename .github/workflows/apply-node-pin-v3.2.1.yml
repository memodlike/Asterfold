name: Apply deterministic Node pin for 3.2.1

on:
  push:
    branches: ["agent/asterfold-3.2.1-store-listing-optimization"]
    paths:
      - .github/workflows/apply-node-pin-v3.2.1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-3.2.1-store-listing-optimization
          fetch-depth: 0

      - name: Apply root-cause fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/node-pin-v3.2.1.patch
          git apply .github/node-pin-v3.2.1.patch
          rm .github/node-pin-v3.2.1.patch
          rm .github/workflows/apply-node-pin-v3.2.1.yml
          git diff --check
          test "$(grep -c 'node-version: 22.23.2' .github/workflows/ci.yml)" = "3"
          test "$(grep -c 'node-version: 22.23.2' .github/workflows/release.yml)" = "1"

      - name: Commit deterministic release tooling fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/release.yml
          git add -u .github/node-pin-v3.2.1.patch .github/workflows/apply-node-pin-v3.2.1.yml
          git diff --cached --check
          git commit -m "ci: pin Node 22.23.2 for reproducible release provenance"
          git push origin HEAD:agent/asterfold-3.2.1-store-listing-optimization
