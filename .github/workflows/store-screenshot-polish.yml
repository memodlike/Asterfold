name: Rebuild Store settings screenshot

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: store-screenshot-polish-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  polish:
    if: github.actor == 'memodlike' && github.event.pull_request.head.ref == 'agent/chrome-store-readiness-2.2.3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/chrome-store-readiness-2.2.3
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Apply framing fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=nowarn .store-screenshot-polish.patch
          rm -f .store-screenshot-polish.patch

      - name: Install dependencies
        run: npm ci

      - name: Build production extension
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture real MV3 Store screenshots
        env:
          ASTERFOLD_CAPTURE_SCREENSHOTS: "1"
        run: npm run test:e2e

      - name: Commit polished settings screenshot
        shell: bash
        run: |
          set -euo pipefail
          cp docs/images/03-settings-1280x800.png store-assets/screenshots/03-settings-1280x800.png
          rm -f .github/workflows/store-screenshot-polish.yml
          git add \
            e2e/extension.spec.ts \
            docs/images/03-settings-1280x800.png \
            store-assets/screenshots/03-settings-1280x800.png \
            .store-screenshot-polish.patch \
            .github/workflows/store-screenshot-polish.yml
          git config user.name "Asterfold Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "docs: polish Chrome Web Store settings screenshot"
          git push origin HEAD:agent/chrome-store-readiness-2.2.3
