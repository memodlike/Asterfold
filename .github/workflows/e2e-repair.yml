name: Repair E2E locale isolation

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'memodlike' && github.event.pull_request.head.ref == 'agent/chrome-store-readiness-2.2.3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/chrome-store-readiness-2.2.3
          persist-credentials: true
      - name: Make locale state deterministic between serial MV3 tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/e2e/extension.spec.ts")
          text = path.read_text()
          old_locale_tail = '''    expect(externalRequests).toEqual([]);
    await setWorkspaceLocale(page, "en");
    await page.close();
'''
          new_locale_tail = '''    expect(externalRequests).toEqual([]);
    await setWorkspaceLocale(page, "en");
    await page.reload();
    await expect(page).toHaveTitle("New Tab");
    await page.close();
'''
          old_core_start = '''    await page.setViewportSize({ width: 1440, height: 900 });
    await page.goto(`chrome-extension://${extensionId}/newtab.html`);
    await expect(page).toHaveTitle("New Tab");
    await expect(page.locator('link[rel="icon"]')).toHaveAttribute("href", "/icons/new-tab.svg");
'''
          new_core_start = '''    await page.setViewportSize({ width: 1440, height: 900 });
    await page.goto(`chrome-extension://${extensionId}/newtab.html`);
    await expect(page.locator(".app-shell")).toBeVisible();
    await setWorkspaceLocale(page, "en");
    await page.reload();
    await expect(page).toHaveTitle("New Tab");
    await expect(page.locator('link[rel="icon"]')).toHaveAttribute("href", "/icons/new-tab.svg");
'''
          if old_locale_tail not in text:
              raise SystemExit("Locale test cleanup block was not found")
          if old_core_start not in text:
              raise SystemExit("Core flow locale setup block was not found")
          text = text.replace(old_locale_tail, new_locale_tail, 1)
          text = text.replace(old_core_start, new_core_start, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/e2e-repair.yml
          git add -A
          git config user.name "Asterfold E2E Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test: isolate MV3 locale state"
          git push origin HEAD:agent/chrome-store-readiness-2.2.3
