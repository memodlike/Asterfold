name: Update audited development dependencies

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: update-audit-dependencies
  cancel-in-progress: true

jobs:
  update:
    if: github.head_ref == 'agent/asterfold-v3-store-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Preserve structural types in the upgrade regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("e2e/upgrade.spec.ts")
          source = path.read_text()
          marker = 'test.skip(!baselinePath || !targetZip, "Exact 2.2.3 upgrade fixture is prepared only in CI/release gates.");\n'
          if "interface UpgradeSeedData" not in source:
              source = source.replace(marker, marker + '''\ntype UpgradeRecord = Record<string, unknown>;\n\ninterface UpgradeSeedData {\n  pageRecord: UpgradeRecord;\n  boardRecord: UpgradeRecord;\n  bookmarkRecord: UpgradeRecord;\n  trashRecord: UpgradeRecord;\n}\n''')
          source = source.replace(
              'async function seedVersion223(page: Page): Promise<Record<string, unknown>> {\n  return page.evaluate(async () => {',
              'async function seedVersion223(page: Page): Promise<UpgradeSeedData> {\n  return page.evaluate<UpgradeSeedData>(async () => {',
          )
          source = source.replace('pageRecord: await read("pages", "upgrade-page")', 'pageRecord: await read<UpgradeRecord>("pages", "upgrade-page")')
          source = source.replace('boardRecord: await read("boards", "upgrade-board")', 'boardRecord: await read<UpgradeRecord>("boards", "upgrade-board")')
          source = source.replace('bookmarkRecord: await read("bookmarks", "upgrade-bookmark")', 'bookmarkRecord: await read<UpgradeRecord>("bookmarks", "upgrade-bookmark")')
          source = source.replace('trashRecord: await read("bookmarks", "upgrade-trash")', 'trashRecord: await read<UpgradeRecord>("bookmarks", "upgrade-trash")')
          path.write_text(source)
          PY
      - name: Install audited fixed versions
        id: install
        shell: bash
        run: |
          set +e
          npm config set fetch-retries 2
          npm config set fetch-timeout 60000
          {
            echo '=== peer metadata ==='
            npm view eslint@10.8.0 version engines --json
            npm view eslint-plugin-react-hooks@7.1.1 version peerDependencies --json
            npm view eslint-plugin-react-refresh@0.5.3 version peerDependencies --json
            npm view typescript-eslint@8.65.0 version peerDependencies --json
            npm view wxt@0.21.2 version engines peerDependencies --json
            npm view @playwright/test@1.62.0 version engines --json
            echo '=== existing clean install ==='
          } > install.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm ci >> install.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm pkg set \
              'devDependencies.@eslint/js=10.0.1' \
              'devDependencies.@playwright/test=1.62.0' \
              'devDependencies.eslint=10.8.0' \
              'devDependencies.eslint-plugin-react-hooks=7.1.1' \
              'devDependencies.eslint-plugin-react-refresh=0.5.3' \
              'devDependencies.typescript-eslint=8.65.0' \
              'devDependencies.wxt=0.21.2' >> install.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            rm -rf node_modules package-lock.json
            timeout 240s npm install --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel=verbose >> install.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm ci >> install.log 2>&1
            status=$?
          fi
          cat install.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload toolchain install evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toolchain-install-log
          path: install.log
          if-no-files-found: error
      - name: Enforce toolchain install result
        shell: bash
        run: test "${{ steps.install.outputs.status }}" = "0"
      - name: Upload exact toolchain candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toolchain-candidate
          path: |
            package.json
            package-lock.json
            e2e/upgrade.spec.ts
          if-no-files-found: error
      - name: Capture post-upgrade audit
        shell: bash
        run: npm audit --json > npm-audit-after.json || true
      - name: Upload post-upgrade audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit-after-toolchain-upgrade
          path: npm-audit-after.json
          if-no-files-found: error
      - name: Production dependency audit
        run: npm run audit:production
      - name: Development dependency audit baseline
        run: node scripts/check-audit-baseline.mjs npm-audit-after.json
      - name: Capture typecheck result
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload typecheck evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: typecheck-after-toolchain-upgrade
          path: typecheck.log
          if-no-files-found: error
      - name: Enforce typecheck result
        shell: bash
        run: test "${{ steps.typecheck.outputs.status }}" = "0"
      - name: Capture lint result
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > lint.log 2>&1
          status=$?
          cat lint.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload lint evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-after-toolchain-upgrade
          path: lint.log
          if-no-files-found: error
      - name: Enforce lint result
        shell: bash
        run: test "${{ steps.lint.outputs.status }}" = "0"
      - name: Coverage upgraded toolchain
        run: npm run test:coverage
      - name: Reproducible release upgraded toolchain
        run: npm run release:repro
      - name: Commit dependency and typing update
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json e2e/upgrade.spec.ts
          if git diff --cached --quiet; then
            echo "Dependency and typing files already match the audited fixed versions."
            exit 0
          fi
          git diff --cached --check
          git config user.name "Asterfold Release Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): update audited development toolchain"
          git push origin HEAD:refs/heads/agent/asterfold-v3-store-hardening
