name: Apply final Asterfold 3.0.1 source

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-final-asterfold-source
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/asterfold-v3-store-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Apply deterministic source transition
        run: node scripts/finalize-3-0-1.mjs
      - name: Validate final source
        run: |
          node scripts/validate-version.mjs
          git diff --check
      - name: Remove temporary automation and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/patches
          rm -f .github/workflows/apply-coverage-test-fixes.yml
          rm -f .github/workflows/diagnose-coverage-patch.yml
          rm -f .github/workflows/finalize-version-3-0-1.yml
          rm -f .github/workflows/finalize-source-tree.yml
          rm -f .github/workflows/apply-final-source.yml
          rm -f scripts/finalize-3-0-1.mjs
          git add -A
          git diff --cached --check
          git config user.name 'Asterfold Release Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: finalize Asterfold 3.0.1 source tree'
          git push origin HEAD:refs/heads/agent/asterfold-v3-store-hardening
