name: Report Asterfold 3.0.1 publication result

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  issues: write
  contents: read

concurrency:
  group: report-v3.0.1-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Post CI and Release status to issue 22
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/jobs.json
          release_json='{}'
          if gh release view v3.0.1 --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url,assets >/tmp/release.json 2>/dev/null; then
            release_json="$(cat /tmp/release.json)"
          fi
          RELEASE_JSON="$release_json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const jobsPayload = JSON.parse(fs.readFileSync('/tmp/jobs.json', 'utf8'));
          const release = JSON.parse(process.env.RELEASE_JSON || '{}');
          const jobs = (jobsPayload.jobs || []).map((job) => ({
            name: job.name,
            status: job.status,
            conclusion: job.conclusion,
            url: job.html_url
          }));
          const lines = [
            '## Final Asterfold 3.0.1 publication pipeline',
            '',
            `- CI run: [${process.env.RUN_ID}](${process.env.RUN_URL})`,
            `- Main SHA: \`${process.env.HEAD_SHA}\``,
            `- Overall conclusion: **${process.env.RUN_CONCLUSION}**`,
            '',
            '### Jobs'
          ];
          for (const job of jobs) {
            lines.push(`- [${job.name}](${job.url}) — **${job.conclusion ?? job.status}**`);
          }
          lines.push('', '### GitHub Release');
          if (release.url) {
            lines.push(`- Release: [${release.tagName}](${release.url})`);
            lines.push(`- Target: \`${release.targetCommitish}\``);
            lines.push(`- Draft: \`${release.isDraft}\`; prerelease: \`${release.isPrerelease}\``);
            lines.push(`- Assets: ${Array.isArray(release.assets) ? release.assets.length : 0}`);
            for (const asset of release.assets ?? []) lines.push(`  - ${asset.name} — ${asset.size} bytes`);
          } else {
            lines.push('- Release object: **not published**');
          }
          lines.push('', `_Observed: ${new Date().toISOString()}_`);
          fs.writeFileSync('/tmp/final-v3.0.1-status.md', `${lines.join('\n')}\n`);
NODE
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/22/comments" -f body="$(cat /tmp/final-v3.0.1-status.md)" >/dev/null
