name: Fix Asterfold 3.1.1 backup preview expectation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'perf/asterfold-3.1.1-wallpaper-import-polish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: perf/asterfold-3.1.1-wallpaper-import-polish
          fetch-depth: 0
      - name: Align reviewed backup preview assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/settingsDialogCoverage.test.ts')
          text = path.read_text()
          old = r'/v3\.1\.0 · 1 \/ 1 \/ 1/'
          new = r'/v3\.1\.1 · 1 \/ 1 \/ 1/'
          if text.count(old) != 1:
              raise SystemExit(f'expected one reviewed stale assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          remaining="$(grep -RIn --include='*.test.ts' --include='*.spec.ts' '3\.1\.0' tests e2e || true)"
          if [ -n "$remaining" ]; then
            echo "$remaining"
            echo 'Additional 3.1.0 test references require explicit review.' >&2
            exit 1
          fi
          git add tests/settingsDialogCoverage.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: expect Asterfold 3.1.1 backup preview'
          git push origin HEAD:perf/asterfold-3.1.1-wallpaper-import-polish
