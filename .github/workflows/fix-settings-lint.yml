name: Fix Settings coverage lint

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: fix-settings-coverage-lint
  cancel-in-progress: true

jobs:
  fix:
    if: github.head_ref == 'agent/asterfold-v3-store-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3-store-hardening
          fetch-depth: 0
      - name: Apply exact lint corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/settingsDialogBehavior.test.ts')
          text = path.read_text()
          replacements = [
            (
              'const mocks = vi.hoisted(() => ({',
              'const confirmMock = vi.fn(() => true);\n\nconst mocks = vi.hoisted(() => ({',
            ),
            (
              '  vi.spyOn(window, "confirm").mockReturnValue(true);',
              '  confirmMock.mockReset();\n  confirmMock.mockReturnValue(true);\n  vi.stubGlobal("confirm", confirmMock);',
            ),
            (
              '  vi.restoreAllMocks();',
              '  vi.restoreAllMocks();\n  vi.unstubAllGlobals();',
            ),
            (
              '''    expect(mocks.downloadText.mock.calls.map((call) => call[0])).toEqual(expect.arrayContaining([
      expect.stringMatching(/^asterfold-backup-v3-/),
      "asterfold-bookmarks.html",
      "asterfold-bookmarks.md",
    ]));''',
              '''    expect(mocks.downloadText).toHaveBeenNthCalledWith(1, expect.stringMatching(/^asterfold-backup-v3-/), "{\\"backup\\":true}", "application/json");
    expect(mocks.downloadText).toHaveBeenNthCalledWith(2, "asterfold-bookmarks.html", "<DL></DL>", "text/html");
    expect(mocks.downloadText).toHaveBeenNthCalledWith(3, "asterfold-bookmarks.md", "# Bookmarks", "text/markdown");''',
            ),
            ('    vi.mocked(window.confirm).mockReturnValueOnce(false);', '    confirmMock.mockReturnValueOnce(false);'),
            ('    vi.mocked(window.confirm).mockReturnValueOnce(true);', '    confirmMock.mockReturnValueOnce(true);'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate correction
        run: |
          npm run typecheck
          npm run lint
          npx vitest run tests/settingsDialogBehavior.test.ts
      - name: Commit ordinary test fix and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-settings-lint.yml
          rm -f .github/fix-settings-lint.trigger
          git add tests/settingsDialogBehavior.test.ts .github
          git diff --cached --check
          git config user.name 'Asterfold Release Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: satisfy strict Settings coverage lint'
          git push origin HEAD:refs/heads/agent/asterfold-v3-store-hardening
