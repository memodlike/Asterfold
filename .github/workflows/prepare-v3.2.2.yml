name: Prepare Asterfold 3.2.2

on:
  push:
    branches:
      - release/asterfold-3.2.2-design-hardening

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release/asterfold-3.2.2-design-hardening
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Refresh vulnerable transitive dependency
        shell: bash
        run: |
          set -euo pipefail
          npm update nanoid --package-lock-only --ignore-scripts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const version = lock.packages?.['node_modules/nanoid']?.version;
          if (version !== '3.3.17') throw new Error(`Expected patched nanoid 3.3.17, got ${version}`);
          NODE
      - name: Bump release version and metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 3.2.2 --no-git-tag-version
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const replaceOnce = (path, from, to) => {
            const before = fs.readFileSync(path, 'utf8');
            if (!before.includes(from)) throw new Error(`${path}: missing ${from}`);
            fs.writeFileSync(path, before.replace(from, to));
          };
          replaceOnce('docs/security/privacy.md', 'Policy version: 3.2.1', 'Policy version: 3.2.2');
          replaceOnce('docs/security/privacy.md', 'Applies to: Asterfold 3.2.1', 'Applies to: Asterfold 3.2.2');
          replaceOnce('docs/store/privacy.html', 'Policy version: 3.2.1', 'Policy version: 3.2.2');
          replaceOnce('docs/store/privacy.html', 'Asterfold 3.2.1', 'Asterfold 3.2.2');
          replaceOnce('docs/store/submission-checklist.md', 'Current version: 3.2.1', 'Current version: 3.2.2');
          replaceOnce('store-assets/listing/submission-values.md', 'Current version: 3.2.1', 'Current version: 3.2.2');

          const notesPath = 'docs/release/release-notes.md';
          const notes = fs.readFileSync(notesPath, 'utf8');
          const section = `# Asterfold 3.2.2\n\n## Design-system hardening\n\n- Unified Quick Save with Light/Dark/System semantic theme tokens and the active accent while keeping opaque, weak-PC-safe surfaces.\n- Corrected startup theme and Motion Off behavior, blocking-overlay orchestration, lazy overlay feedback, bookmark reveal, and toast timing.\n- Added container-aware Board columns, responsive hit areas, mobile Board sizing, Settings scrolling, and performance-mode affordance fixes.\n- Added regression coverage for startup motion, overlay invariants, Board column behavior, and toast lifecycle.\n- Refreshed the transitive Nano ID 3.x security patch used by the development toolchain; runtime permissions and local-first behavior are unchanged.\n\n`;
          if (!notes.startsWith('# Asterfold 3.2.2')) fs.writeFileSync(notesPath, section + notes);

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace('Asterfold 3.2.1 produces a reproducible', 'Asterfold 3.2.2 produces a reproducible');
          readme = readme.replace(/\*\*Asterfold 3\.2\.1\*\* updates the extension name and Chrome Web Store listing metadata around the verified visual bookmark workspace use case\. Runtime functionality, local-first storage behavior and the permission surface are unchanged from 3\.2\.0\./,
            '**Asterfold 3.2.2** hardens the visual design system, popup theming, startup motion, overlay lifecycle and responsive behavior while preserving the local-first architecture and permission surface.');
          const historyNeedle = '## Version history\n\n';
          if (!readme.includes('**v3.2.2 — Design-system hardening.**')) {
            readme = readme.replace(historyNeedle, `${historyNeedle}1. **v3.2.2 — Design-system hardening.** Unifies popup theming, startup motion, overlay lifecycle, responsive Board behavior, performance affordances, and regression coverage without changing permissions or the local-first architecture.\n`);
          }
          fs.writeFileSync(readmePath, readme);
          NODE
          rm -f .github/workflows/prepare-v3.2.2.yml
      - name: Validate prepared source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run validate:version
          npm run audit:production
          npm audit --json > npm-audit.json || true
          node scripts/check-audit-baseline.mjs npm-audit.json
          rm -f npm-audit.json
          npm run scan:source
          npm run typecheck
          npm run lint
          npm run build
          REQUIRE_GENERATED_MANIFEST=true npm run validate:version
          npm run validate:store
          git diff --check
      - name: Commit prepared release source
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json README.md docs/release/release-notes.md docs/security/privacy.md docs/store/privacy.html docs/store/submission-checklist.md store-assets/listing/submission-values.md .github/workflows/prepare-v3.2.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: prepare Asterfold 3.2.2 design hardening"
          git push origin HEAD:release/asterfold-3.2.2-design-hardening
