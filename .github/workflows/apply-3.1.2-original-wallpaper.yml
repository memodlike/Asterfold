name: Apply Asterfold 3.1.2 original wallpaper patch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'perf/asterfold-3.1.2-original-wallpaper-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: perf/asterfold-3.1.2-original-wallpaper-quality
          fetch-depth: 0
      - name: Assemble and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/patches/3.1.2/part-00.b64 \
            .github/patches/3.1.2/part-01.b64 \
            .github/patches/3.1.2/part-02.b64 \
            .github/patches/3.1.2/part-03.b64 \
            .github/patches/3.1.2/part-04.b64 \
            .github/patches/3.1.2/part-05.b64 \
            .github/patches/3.1.2/part-06.b64 \
            .github/patches/3.1.2/part-07a.b64 \
            .github/patches/3.1.2/part-07b.b64 \
            .github/patches/3.1.2/part-08a.b64 \
            .github/patches/3.1.2/part-08b.b64 \
            | tr -d '\n' | base64 -d > /tmp/asterfold-3.1.2.patch
          echo '03b12180f7e743efbeef1322ebf1b619d8fb9943e242306df5f23ed14521808a  /tmp/asterfold-3.1.2.patch' | sha256sum --check
          git apply --check /tmp/asterfold-3.1.2.patch
          git apply /tmp/asterfold-3.1.2.patch
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: preserve original uploaded wallpapers in 3.1.2'
          git push origin HEAD:perf/asterfold-3.1.2-original-wallpaper-quality
