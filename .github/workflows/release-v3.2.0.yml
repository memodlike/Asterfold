name: Publish Asterfold 3.2.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v3.2.0.yml

permissions:
  contents: write
  actions: read
  checks: read
  attestations: write
  id-token: write

concurrency:
  group: publish-asterfold-v3.2.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: v3.2.0
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Verify release target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./package.json').version")" = "3.2.0"
          test "$(node -p "require('./package-lock.json').version")" = "3.2.0"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Wait for exact-SHA CI and CodeQL
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ci_run_id=""
          for attempt in $(seq 1 120); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            result="$(RUNS_JSON="$runs" node --input-type=module <<'NODE'
          const runs = JSON.parse(process.env.RUNS_JSON).workflow_runs ?? [];
          const pushRuns = runs.filter((run) => run.event === 'push');
          const ci = pushRuns.find((run) => run.name === 'CI');
          const codeql = pushRuns.find((run) => run.name === 'CodeQL');
          const failed = [ci, codeql].some((run) => run?.status === 'completed' && run.conclusion !== 'success');
          if (failed) {
            console.log('failed');
          } else if (ci?.status === 'completed' && ci.conclusion === 'success' && codeql?.status === 'completed' && codeql.conclusion === 'success') {
            console.log(`ready:${ci.id}`);
          } else {
            console.log('waiting');
          }
          NODE
            )"
            if [[ "$result" == ready:* ]]; then
              ci_run_id="${result#ready:}"
              break
            fi
            if [[ "$result" == "failed" ]]; then
              echo "::error::CI or CodeQL failed for $GITHUB_SHA."
              exit 1
            fi
            sleep 5
          done
          test -n "$ci_run_id"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.gates.outputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir release
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-linux --dir release
          expected=(Asterfold-Chrome.zip chrome-unpacked.zip extension-source.zip Asterfold-Store-Assets.zip checksums.txt provenance.json sbom.spdx.json)
          for name in "${expected[@]}"; do test -f "release/$name"; done

      - name: Verify artifacts and provenance
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run validate:version
          (cd release && sha256sum --check checksums.txt)
          EXPECTED_SOURCE_SHA="$GITHUB_SHA" EXPECTED_TAG="$RELEASE_TAG" node scripts/verify-provenance.mjs release

      - name: Create immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"

      - name: Attest release assets
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-checksums: release/checksums.txt

      - name: Attest checksums manifest
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: release/checksums.txt

      - name: Attest Store package SBOM
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: release/Asterfold-Chrome.zip
          sbom-path: release/sbom.spdx.json

      - name: Publish Asterfold 3.2.0 as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          store_sha="$(sha256sum release/Asterfold-Chrome.zip | cut -d' ' -f1)"
          cp docs/release/release-notes.md release-notes.md
          printf '\n### Verification\n\n`Asterfold-Chrome.zip` SHA-256: `%s`\n\nBuild provenance, SBOM and checksums are attached. GitHub-generated source archives are not the Chrome Web Store upload package.\n' "$store_sha" >> release-notes.md
          gh release create "$RELEASE_TAG" \
            release/Asterfold-Chrome.zip \
            release/chrome-unpacked.zip \
            release/extension-source.zip \
            release/Asterfold-Store-Assets.zip \
            release/checksums.txt \
            release/provenance.json \
            release/sbom.spdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Asterfold 3.2.0" \
            --notes-file release-notes.md \
            --latest

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published-release
          mkdir published-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published-release
          expected=(Asterfold-Chrome.zip chrome-unpacked.zip extension-source.zip Asterfold-Store-Assets.zip checksums.txt provenance.json sbom.spdx.json)
          mapfile -t actual < <(find published-release -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${sorted_expected[*]}"
          for name in "${expected[@]}"; do cmp "release/$name" "published-release/$name"; done
          (cd published-release && sha256sum --check checksums.txt)
          EXPECTED_SOURCE_SHA="$GITHUB_SHA" EXPECTED_TAG="$RELEASE_TAG" node scripts/verify-provenance.mjs published-release
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          gh attestation verify published-release/Asterfold-Chrome.zip --repo "$GITHUB_REPOSITORY"
