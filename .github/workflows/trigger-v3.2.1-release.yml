name: Trigger verified Asterfold 3.2.1 release

on:
  push:
    branches: ["agent/asterfold-v3.2.1-release-trigger"]
    paths:
      - .github/workflows/trigger-v3.2.1-release.yml

permissions:
  contents: write
  actions: write
  checks: read
  attestations: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MAIN_SHA: 28937865d10ea7b42eac2387a73b5b5a41d58171
      RELEASE_TAG: v3.2.1
    steps:
      - name: Check out release trigger branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/asterfold-v3.2.1-release-trigger
          fetch-depth: 0
          fetch-tags: true

      - name: Verify exact main and required push workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git show "$MAIN_SHA:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{process.stdout.write(JSON.parse(s).version)})")" = "3.2.1"

          ready=false
          for attempt in $(seq 1 180); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_SHA&per_page=100" > /tmp/runs.json
            if MAIN_SHA="$MAIN_SHA" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sha = process.env.MAIN_SHA;
          const runs = JSON.parse(fs.readFileSync('/tmp/runs.json', 'utf8')).workflow_runs ?? [];
          const pushRuns = runs.filter((run) => run.event === 'push' && run.head_sha === sha);
          for (const name of ['CI', 'CodeQL']) {
            const matches = pushRuns.filter((run) => run.name === name);
            if (matches.some((run) => run.status === 'completed' && run.conclusion !== 'success')) {
              throw new Error(`${name} has a non-successful completed push run for ${sha}`);
            }
            if (!matches.some((run) => run.status === 'completed' && run.conclusion === 'success')) process.exit(1);
          }
          NODE
            then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = "true"

      - name: Create exact annotated tag and dispatch existing release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$MAIN_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$MAIN_SHA" -m "Asterfold 3.2.1 store listing optimization"
            git push origin "$RELEASE_TAG"
          fi
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$MAIN_SHA"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"

      - name: Wait for and verify published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          published=false
          for attempt in $(seq 1 360); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url,assets > /tmp/release.json 2>/dev/null; then
              if RELEASE_JSON=/tmp/release.json MAIN_SHA="$MAIN_SHA" RELEASE_TAG="$RELEASE_TAG" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8'));
          if (release.tagName !== process.env.RELEASE_TAG || release.isDraft || release.isPrerelease) process.exit(1);
          const target = release.targetCommitish;
          if (![process.env.MAIN_SHA, process.env.RELEASE_TAG, 'main'].includes(target)) process.exit(1);
          const expected = new Set(['Asterfold-Chrome.zip','chrome-unpacked.zip','extension-source.zip','Asterfold-Store-Assets.zip','checksums.txt','provenance.json','sbom.spdx.json']);
          const actual = new Set((release.assets ?? []).map((asset) => asset.name));
          if (expected.size !== actual.size || [...expected].some((name) => !actual.has(name))) process.exit(1);
          NODE
              then
                published=true
                break
              fi
            fi
            sleep 5
          done
          test "$published" = "true"

          rm -rf /tmp/published-release && mkdir -p /tmp/published-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/published-release
          expected=(Asterfold-Chrome.zip chrome-unpacked.zip extension-source.zip Asterfold-Store-Assets.zip checksums.txt provenance.json sbom.spdx.json)
          mapfile -t actual < <(find /tmp/published-release -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${sorted_expected[*]}"
          (cd /tmp/published-release && sha256sum --check checksums.txt)
          EXPECTED_SOURCE_SHA="$MAIN_SHA" EXPECTED_TAG="$RELEASE_TAG" node scripts/verify-provenance.mjs /tmp/published-release
          gh attestation verify /tmp/published-release/Asterfold-Chrome.zip --repo "$GITHUB_REPOSITORY"

      - name: Record release verification evidence on trigger branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_SHA&per_page=100" > /tmp/runs-final.json
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url,publishedAt,assets > /tmp/release-final.json
          MAIN_SHA="$MAIN_SHA" RELEASE_TAG="$RELEASE_TAG" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runs = JSON.parse(fs.readFileSync('/tmp/runs-final.json', 'utf8')).workflow_runs ?? [];
          const selected = {};
          for (const name of ['CI', 'CodeQL', 'Publish GitHub Release']) {
            const matches = runs.filter((run) => run.name === name && (name === 'Publish GitHub Release' || (run.event === 'push' && run.head_sha === process.env.MAIN_SHA)));
            const latest = matches.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
            if (latest) selected[name] = { id: latest.id, event: latest.event, status: latest.status, conclusion: latest.conclusion, html_url: latest.html_url, head_sha: latest.head_sha };
          }
          const release = JSON.parse(fs.readFileSync('/tmp/release-final.json', 'utf8'));
          const checksums = fs.readFileSync('/tmp/published-release/checksums.txt', 'utf8').trim().split(/\r?\n/);
          const evidence = {
            version: '3.2.1',
            mainSha: process.env.MAIN_SHA,
            tag: process.env.RELEASE_TAG,
            tagCommit: process.env.MAIN_SHA,
            workflows: selected,
            release,
            checksums,
            verification: {
              expectedAssetCount: 7,
              assetSetVerified: true,
              checksumsVerified: true,
              provenanceVerified: true,
              attestationVerified: true
            }
          };
          fs.writeFileSync('release-verification-v3.2.1.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-verification-v3.2.1.json
          git commit -m "chore: record Asterfold 3.2.1 release verification"
          git push origin HEAD:agent/asterfold-v3.2.1-release-trigger
