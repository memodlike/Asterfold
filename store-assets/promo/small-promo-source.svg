<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">Asterfold small promotional tile</title>
  <desc id="desc">Asterfold folded asterisk above three restrained glass workspace panels on a graphite background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101217"/>
      <stop offset=".58" stop-color="#191C23"/>
      <stop offset="1" stop-color="#0C0E12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(220 78) rotate(90) scale(194 244)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8DA9DC" stop-opacity=".32"/>
      <stop offset=".52" stop-color="#536A95" stop-opacity=".10"/>
      <stop offset="1" stop-color="#15171B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F8FC" stop-opacity=".15"/>
      <stop offset="1" stop-color="#F6F8FC" stop-opacity=".055"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="440" height="280" fill="url(#bg)"/>
  <rect width="440" height="280" fill="url(#glow)"/>

  <g opacity=".86" filter="url(#shadow)">
    <rect x="24" y="107" width="116" height="91" rx="19" fill="url(#panel)" stroke="#E8EDF7" stroke-opacity=".17"/>
    <rect x="151" y="96" width="138" height="111" rx="22" fill="url(#panel)" stroke="#E8EDF7" stroke-opacity=".22"/>
    <rect x="300" y="107" width="116" height="91" rx="19" fill="url(#panel)" stroke="#E8EDF7" stroke-opacity=".17"/>
    <g fill="#E9EDF5" fill-opacity=".38">
      <rect x="42" y="128" width="45" height="5" rx="2.5"/>
      <rect x="42" y="143" width="73" height="4" rx="2"/>
      <rect x="42" y="156" width="60" height="4" rx="2"/>
      <rect x="171" y="121" width="54" height="5" rx="2.5"/>
      <rect x="171" y="139" width="91" height="4" rx="2"/>
      <rect x="171" y="153" width="76" height="4" rx="2"/>
      <rect x="171" y="167" width="85" height="4" rx="2"/>
      <rect x="318" y="128" width="44" height="5" rx="2.5"/>
      <rect x="318" y="143" width="69" height="4" rx="2"/>
      <rect x="318" y="156" width="55" height="4" rx="2"/>
    </g>
  </g>

  <g transform="translate(176 22) scale(1.375)">
    <g fill="#F5F7FA">
      <path d="M32 3 41 24 35 29 28 24Z"/>
      <path d="m61 32-21 9-5-6 5-7Z"/>
      <path d="m32 61-9-21 6-5 7 5Z"/>
      <path d="M3 32 24 23l5 6-5 7Z"/>
    </g>
    <path d="m32 28 4 4-4 4-4-4Z" fill="#171A20"/>
  </g>

  <text x="220" y="245" fill="#F5F7FA" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="28" font-weight="650" letter-spacing="-.5">Asterfold</text>
</svg>
