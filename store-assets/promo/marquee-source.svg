<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Asterfold Chrome Web Store marquee</title>
  <desc id="desc">Asterfold identity and a restrained representation of its visual bookmark workspace on a graphite background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1014"/>
      <stop offset=".5" stop-color="#1A1D24"/>
      <stop offset="1" stop-color="#0B0D11"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0" cy="0" r="1" gradientTransform="translate(1045 222) rotate(130) scale(552 790)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A3B8DD" stop-opacity=".35"/>
      <stop offset=".42" stop-color="#657CA4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#111319" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFBFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FAFBFF" stop-opacity=".055"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF" stop-opacity=".13"/>
      <stop offset=".34" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <rect width="1400" height="560" fill="url(#aurora)"/>

  <g transform="translate(106 117)">
    <g transform="translate(0 0) scale(1.55)">
      <g fill="#F5F7FA">
        <path d="M32 3 41 24 35 29 28 24Z"/>
        <path d="m61 32-21 9-5-6 5-7Z"/>
        <path d="m32 61-9-21 6-5 7 5Z"/>
        <path d="M3 32 24 23l5 6-5 7Z"/>
      </g>
      <path d="m32 28 4 4-4 4-4-4Z" fill="#171A20"/>
    </g>
    <text x="0" y="180" fill="#F5F7FA"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="64" font-weight="650" letter-spacing="-2.2">Asterfold</text>
    <text x="2" y="230" fill="#C8CFDB"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="23" font-weight="450" letter-spacing="-.2">Visual bookmark workspace</text>
    <text x="2" y="268" fill="#9099A8"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="18" font-weight="500" letter-spacing=".2">Local-first · no account required</text>
  </g>

  <g transform="translate(610 68) rotate(-1.4 340 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="700" height="424" rx="34" fill="#121419" stroke="#EEF2F9" stroke-opacity=".14"/>
    <rect x="0" y="0" width="700" height="424" rx="34" fill="url(#shine)"/>
    <g>
      <rect x="28" y="28" width="307" height="172" rx="23" fill="url(#panel)" stroke="#EEF2F9" stroke-opacity=".18"/>
      <rect x="351" y="28" width="321" height="172" rx="23" fill="url(#panel)" stroke="#EEF2F9" stroke-opacity=".18"/>
      <rect x="28" y="216" width="352" height="180" rx="23" fill="url(#panel)" stroke="#EEF2F9" stroke-opacity=".18"/>
      <rect x="396" y="216" width="276" height="180" rx="23" fill="url(#panel)" stroke="#EEF2F9" stroke-opacity=".18"/>
    </g>
    <g fill="#F4F6FA" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <text x="52" y="62" font-size="17" font-weight="650">Work</text>
      <text x="375" y="62" font-size="17" font-weight="650">Design</text>
      <text x="52" y="250" font-size="17" font-weight="650">Research</text>
      <text x="420" y="250" font-size="17" font-weight="650">Documents</text>
    </g>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#DCE1EA">
      <g transform="translate(52 86)">
        <circle cx="7" cy="7" r="7" fill="#98A9C7"/><text x="24" y="12">GitHub</text>
        <circle cx="7" cy="38" r="7" fill="#7D91B8"/><text x="24" y="43">Linear</text>
        <circle cx="7" cy="69" r="7" fill="#B7C1D4"/><text x="24" y="74">Notion</text>
      </g>
      <g transform="translate(375 86)">
        <circle cx="7" cy="7" r="7" fill="#93A6C9"/><text x="24" y="12">Figma</text>
        <circle cx="7" cy="38" r="7" fill="#728AB7"/><text x="24" y="43">Product references</text>
        <circle cx="7" cy="69" r="7" fill="#B0B9CA"/><text x="24" y="74">Design system</text>
      </g>
      <g transform="translate(52 274)">
        <circle cx="7" cy="7" r="7" fill="#8BA1C8"/><text x="24" y="12">Reading list</text>
        <circle cx="7" cy="38" r="7" fill="#AAB5CA"/><text x="24" y="43">Product notes</text>
        <circle cx="7" cy="69" r="7" fill="#7188B1"/><text x="24" y="74">Market research</text>
      </g>
      <g transform="translate(420 274)">
        <circle cx="7" cy="7" r="7" fill="#8FA4C7"/><text x="24" y="12">Google Docs</text>
        <circle cx="7" cy="38" r="7" fill="#B8C1D1"/><text x="24" y="43">Project brief</text>
        <circle cx="7" cy="69" r="7" fill="#748AB4"/><text x="24" y="74">Meeting notes</text>
      </g>
    </g>
    <g transform="translate(38 372) scale(.42)" fill="#C6CEDB">
      <path d="M32 3 41 24 35 29 28 24Z"/>
      <path d="m61 32-21 9-5-6 5-7Z"/>
      <path d="m32 61-9-21 6-5 7 5Z"/>
      <path d="M3 32 24 23l5 6-5 7Z"/>
      <path d="m32 28 4 4-4 4-4-4Z" fill="#15171B"/>
    </g>
  </g>
</svg>
